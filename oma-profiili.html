<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meetsko — Oma profiili</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='36' height='36' rx='8' fill='%231B3A6B'/%3E%3Crect x='24' y='24' width='36' height='36' rx='8' fill='%238FB3E8'/%3E%3Cpath d='M24 32A8 8 0 0 1 32 24H40V32A8 8 0 0 1 32 40H24Z' fill='%232BB39A'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/app.css" />
<style>
  .profile-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; align-items: start; }
  .profile-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .profile-avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; flex: 0 0 48px; }
  .profile-head .ph-name { font-size: 16px; font-weight: 600; }
  .profile-head .ph-email { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .field-grid .full { grid-column: 1 / -1; }
  .field-grid input { width: 100%; }

  .project-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line-soft); }
  .project-row:first-child { border-top: none; padding-top: 0; }
  .project-row:last-child { padding-bottom: 0; }
  .project-row .info { font-size: 14px; font-weight: 500; }
  .project-row .meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12.5px; color: var(--text-muted); }
  .project-row button { white-space: nowrap; }
  .empty-note { color: var(--text-faint); font-size: 13.5px; margin: 0; }

  @media (max-width: 900px) {
    .profile-layout { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .field-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="appNav"></div>

<main class="page form-scope">
  <a class="back" href="/projektit.html">&larr; <span data-i18n="back_all_projects"></span></a>
  <div class="page-head">
    <h1 data-i18n="heading_my_profile"></h1>
  </div>

  <div class="profile-layout">
    <section class="card-section" id="profileCard"><p class="empty-note" data-i18n="loading"></p></section>
    <section>
      <div id="authReturnBanner"></div>
      <div class="card-section">
        <h2 data-i18n="heading_calendar_by_project"></h2>
        <div id="projectsCard"><p class="empty-note" data-i18n="loading"></p></div>
      </div>
    </section>
  </div>
</main>

<script src="/translations.js"></script>
<script src="/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://nrrhvbxvkizvkcwwglck.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycmh2Ynh2a2l6dmtjd3dnbGNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU3NDAsImV4cCI6MjEwMzA0MTc0MH0.S_M4KyTt4E_UG0ue-T-h89L17yxJKkmb36ZzNRdQnLI";
  const client = supabase.createClient(SUPABASE_URL, ANON_KEY);

  const CLIENT_ID = "54f922c6-aa24-44b4-9305-f28964c09f96";
  const CALENDAR_REDIRECT_URI = "https://nrrhvbxvkizvkcwwglck.supabase.co/functions/v1/auth-callback";

  let currentAccessToken = null;
  let loadedProfile = null;

  AppNav.mount('settings');

  function escapeHtml(str) {
    return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  async function logout() {
    await client.auth.signOut();
    window.location.href = '/login.html';
  }

  async function setLanguagePref(lang) {
    setCurrentLanguage(lang);
    if (loadedProfile) {
      await fetch(`${SUPABASE_URL}/functions/v1/update-my-profile`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({
          firstName: loadedProfile.firstName,
          lastName: loadedProfile.lastName,
          title: loadedProfile.title,
          organization: loadedProfile.organization,
          team: loadedProfile.team,
          language: lang,
        }),
      });
    }
    window.location.reload();
  }

  function authHeaders() {
    return {
      'Content-Type': 'application/json',
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + currentAccessToken,
    };
  }

  async function ensureLoggedIn() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      window.location.href = '/login.html';
      return false;
    }
    currentAccessToken = session.access_token;
    return true;
  }

  async function loadProfile() {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-my-profile`, {
      method: 'POST',
      headers: authHeaders(),
    });
    const data = await res.json();

    if (data.error) {
      document.getElementById('profileCard').innerHTML = `<p class="empty-note">${t('error_prefix')}: ${data.error}</p>`;
      return;
    }

    loadedProfile = data;
    setCurrentLanguage(data.language || 'fi');
    applyStaticTranslations();
    AppNav.setProfile(data);

    const displayName = (data.firstName || data.lastName) ? `${data.firstName || ''} ${data.lastName || ''}`.trim() : data.email;
    document.getElementById('profileCard').innerHTML = `
      <div class="profile-head">
        <div class="profile-avatar">${escapeHtml(AppNav.initials(displayName))}</div>
        <div>
          <div class="ph-name">${escapeHtml(displayName)}</div>
          <div class="ph-email">${escapeHtml(data.email)}</div>
        </div>
        <span class="role-badge" style="margin-left:auto;">${t(data.roleKey)}</span>
      </div>
      <div class="field-grid">
        <div>
          <label for="firstNameInput">${t('first_name_label')}</label>
          <input type="text" id="firstNameInput" value="${escapeHtml(data.firstName)}" />
        </div>
        <div>
          <label for="lastNameInput">${t('last_name_label')}</label>
          <input type="text" id="lastNameInput" value="${escapeHtml(data.lastName)}" />
        </div>
        <div class="full">
          <label for="titleInput">${t('title_label')}</label>
          <input type="text" id="titleInput" value="${escapeHtml(data.title)}" />
        </div>
        <div>
          <label for="organizationInput">${t('organization_label')}</label>
          <input type="text" id="organizationInput" value="${escapeHtml(data.organization)}" ${data.orgLocked ? 'disabled' : ''} />
        </div>
        <div>
          <label for="teamInput">${t('team_label')}</label>
          <input type="text" id="teamInput" value="${escapeHtml(data.team)}" />
        </div>
        <div class="full">
          <label>${t('email_label')}</label>
          <input type="text" value="${escapeHtml(data.email)}" disabled />
        </div>
      </div>
      <div class="btn-row">
        <button onclick="saveProfile()">${t('save_btn')}</button>
      </div>
    `;

    loadProjects();
  }

  async function saveProfile() {
    const body = {
      firstName: document.getElementById('firstNameInput').value,
      lastName: document.getElementById('lastNameInput').value,
      title: document.getElementById('titleInput').value,
           organization: document.getElementById('organizationInput').value,
      team: document.getElementById('teamInput').value,
      language: getCurrentLanguage(),
    };

    const res = await fetch(`${SUPABASE_URL}/functions/v1/update-my-profile`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (data.error) {
      alert(t('error_prefix') + ': ' + data.error);
      return;
    }

    alert(t('alert_profile_saved'));
  }

  function statusLabel(status) {
    if (status === 'authorized') return { text: t('cal_status_authorized'), cls: 'ok' };
    if (status === 'expired') return { text: t('cal_status_expired'), cls: 'warn' };
    return { text: t('cal_status_not_authorized'), cls: 'pending' };
  }

  async function loadProjects() {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-my-projects`, {
      method: 'POST',
      headers: authHeaders(),
    });
    const data = await res.json();

    const card = document.getElementById('projectsCard');

    if (data.error) {
      card.innerHTML = `<p class="empty-note">${t('error_prefix')}: ${data.error}</p>`;
      return;
    }

    if (!data.projects || data.projects.length === 0) {
      card.innerHTML = `<p class="empty-note">${t('empty_no_projects_involved')}</p>`;
      return;
    }

    card.innerHTML = data.projects.map((p) => {
      const st = statusLabel(p.status);
      const orgPart = p.organizationName ? `${escapeHtml(p.organizationName)} / ` : '';
      const roleLabel = p.role === 'admin' ? t('role_admin') : t('role_guest');

      let actionHtml = '';
      if (p.status === 'authorized') {
        actionHtml = `<button class="danger small" onclick="revokeAuth('${p.projectId}')">${t('revoke_auth_btn')}</button>`;
      } else if (p.status === 'expired') {
        actionHtml = `<button class="small" onclick="startAuth('${p.participantId}', ${!!p.calendarWrite})">${t('retry_auth_btn')}</button>`;
      } else {
        actionHtml = `<button class="small" onclick="startAuth('${p.participantId}', ${!!p.calendarWrite})">${t('grant_auth_short')}</button>`;
      }

      return `
        <div class="project-row">
          <div>
            <div class="info">${orgPart}${escapeHtml(p.projectName)}</div>
            <div class="meta"><span class="status-pill ${st.cls}">${st.text}</span><span>${roleLabel}</span></div>
          </div>
          ${actionHtml}
        </div>
      `;
    }).join('');
  }

  const GOOGLE_CLIENT_ID = "1023786751364-dbpmrjj0k1fggbfbb88r7p167o6bt84h.apps.googleusercontent.com";
  const GOOGLE_CALENDAR_REDIRECT_URI = "https://nrrhvbxvkizvkcwwglck.supabase.co/functions/v1/google-auth-callback";

  // Paluukohde "me" ohjaa valtuutuksen jälkeen takaisin tälle sivulle
  // (ks. supabase/functions/_shared/auth-return.ts).
  async function startAuth(participantId, wantsWrite) {
    const { data: { session } } = await client.auth.getSession();
    const provider = session?.user?.app_metadata?.provider;

    if (provider === 'google') {
      const authUrl = new URL('https://accounts.google.com/o/oauth2/v2/auth');
      authUrl.searchParams.set('client_id', GOOGLE_CLIENT_ID);
      authUrl.searchParams.set('response_type', 'code');
      authUrl.searchParams.set('redirect_uri', GOOGLE_CALENDAR_REDIRECT_URI);
      authUrl.searchParams.set('scope', 'https://www.googleapis.com/auth/calendar.readonly');
      authUrl.searchParams.set('access_type', 'offline');
      authUrl.searchParams.set('prompt', 'consent');
      authUrl.searchParams.set('state', `${participantId}||me`);
      window.location.href = authUrl.toString();
      return;
    }

    // Jos kirjoitusoikeus on jo annettu, säilytetään se uudelleenvaltuutuksessa —
    // muuten oikeus katoaisi hiljaisesti.
    const write = !!wantsWrite;

    const authUrl = new URL('https://login.microsoftonline.com/common/oauth2/v2.0/authorize');
    authUrl.searchParams.set('client_id', CLIENT_ID);
    authUrl.searchParams.set('response_type', 'code');
    authUrl.searchParams.set('redirect_uri', CALENDAR_REDIRECT_URI);
    authUrl.searchParams.set('response_mode', 'query');
    authUrl.searchParams.set('scope', write
      ? 'User.Read Calendars.Read Calendars.ReadWrite offline_access'
      : 'User.Read Calendars.Read offline_access');
    authUrl.searchParams.set('state', `${participantId}|${write ? 'rw' : ''}|me`);
    window.location.href = authUrl.toString();
  }

  async function revokeAuth(projectId) {
    if (!confirm(t('confirm_revoke_auth'))) return;

    const res = await fetch(`${SUPABASE_URL}/functions/v1/revoke-calendar-authorization`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ projectId }),
    });
    const data = await res.json();
    if (data.error) { alert(t('error_prefix') + ': ' + data.error); return; }

    loadProjects();
  }

  // Näyttää valtuutuksen tuloksen kun on palattu kirjautumisesta,
  // ja siivoaa parametrit osoitteesta jottei viesti jää roikkumaan.
  function showAuthReturnBanner() {
    const params = new URLSearchParams(window.location.search);
    const status = params.get('status');
    if (!status) return;

    const msgKey = status === 'ok' ? 'banner_auth_ok'
      : status === 'denied' ? 'banner_auth_denied'
      : status === 'email_mismatch' ? 'banner_email_mismatch'
      : 'banner_auth_error';

    document.getElementById('authReturnBanner').innerHTML =
      `<div class="banner ${status === 'ok' ? 'ok' : 'error'}">${t(msgKey)}</div>`;

    const clean = new URL(window.location.href);
    clean.searchParams.delete('status');
    clean.searchParams.delete('pid');
    window.history.replaceState({}, '', clean.toString());
  }

  (async () => {
    const ok = await ensureLoggedIn();
    if (ok) {
      await loadProfile();
      showAuthReturnBanner();
    }
  })();
</script>

</body>
</html>
