<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meetsko — Kirjaudu</title>
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='36' height='36' rx='8' fill='%231B3A6B'/%3E%3Crect x='24' y='24' width='36' height='36' rx='8' fill='%238FB3E8'/%3E%3Cpath d='M24 32A8 8 0 0 1 32 24H40V32A8 8 0 0 1 32 40H24Z' fill='%232BB39A'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/app.css" />
<style>
  .flag-picker { margin-left: auto; display: flex; gap: 6px; }
  .flag-btn { background: none; border: 1px solid transparent; border-radius: 6px; font-size: 18px; padding: 3px 7px; margin: 0; cursor: pointer; line-height: 1; }
  .flag-btn:hover { background: rgba(255,255,255,0.08); border-color: transparent; }
  .flag-btn.active { border-color: #7DA2D6; background: rgba(255,255,255,0.06); }

  .login-wrap { min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; padding: 40px 16px; box-sizing: border-box; }
  .login-card { width: 400px; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 32px; box-sizing: border-box; box-shadow: 0 8px 30px rgba(15,27,45,0.06); }
  .login-card h1 { font-size: 24px; }
  .login-card .tagline { margin: 8px 0 24px; color: var(--text-muted); font-size: 14px; }
  .form-scope .login-card input { width: 100%; margin-bottom: 12px; }
  .login-card button { width: 100%; margin: 0; padding: 11px; font-weight: 600; }
  .login-card button.secondary { margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .login-card button[hidden] { display: none; }
  .login-card button.secondary svg { width: 16px; height: 16px; }
  .divider { display: flex; align-items: center; color: var(--text-faint); font-size: 12px; margin: 20px 0 10px; }
  .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid var(--line); }
  .divider::before { margin-right: 10px; }
  .divider::after { margin-left: 10px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(15,27,45,0.45); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 16px; }
  .modal-card { background: var(--surface); border-radius: 14px; padding: 28px; width: 420px; max-width: 100%; box-sizing: border-box; }
  .modal-card h3 { margin: 0 0 18px; font-size: 18px; }
  .modal-card .field { margin-bottom: 14px; }
  .form-scope .modal-card input { width: 100%; }
</style>
</head>
<body class="form-scope">

<header class="app-nav">
  <div class="app-nav-inner">
    <span class="brand">
      <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="4" width="36" height="36" rx="8" fill="#FFFFFF"/><rect x="24" y="24" width="36" height="36" rx="8" fill="#8FB3E8"/><path d="M24 32A8 8 0 0 1 32 24H40V32A8 8 0 0 1 32 40H24Z" fill="#2BB39A"/></svg>
      Meetsko
    </span>
    <div class="flag-picker">
      <button type="button" class="flag-btn" id="flagFi" onclick="setLoginLanguage('fi')" aria-label="Suomi">🇫🇮</button>
      <button type="button" class="flag-btn" id="flagEn" onclick="setLoginLanguage('en')" aria-label="English">🇬🇧</button>
    </div>
  </div>
</header>

<main class="login-wrap">
  <div class="login-card">
    <h1 data-i18n="login_heading"></h1>
    <p class="tagline" data-i18n="login_tagline"></p>

    <input type="email" id="email" data-i18n-placeholder="email_placeholder" autocomplete="email" />
    <input type="password" id="password" data-i18n-placeholder="password_placeholder" autocomplete="current-password" onkeydown="if(event.key==='Enter') login()" />
    <button onclick="login()" data-i18n="login_btn"></button>
    <div class="error-text" id="status"></div>

    <div class="divider" data-i18n="divider_or"></div>

    <button class="secondary" onclick="loginWithMicrosoft()">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6.5" height="6.5" fill="#F25022"/><rect x="8.5" y="1" width="6.5" height="6.5" fill="#7FBA00"/><rect x="1" y="8.5" width="6.5" height="6.5" fill="#00A4EF"/><rect x="8.5" y="8.5" width="6.5" height="6.5" fill="#FFB900"/></svg>
      <span data-i18n="login_microsoft_btn"></span>
    </button>
    <!-- Google-kirjautuminen piilotettu (27.10.2026): Google-tuki on kehitysvaiheessa eikä
         Supabasen Google-provider ole päällä. Palautus: poista hidden. -->
    <button class="secondary" onclick="loginWithGoogle()" hidden>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="#4285F4" d="M15.7 8.2c0-.6-.1-1.1-.2-1.6H8v3h4.3c-.2 1-.8 1.8-1.6 2.4v2h2.6c1.5-1.4 2.4-3.4 2.4-5.8z"/><path fill="#34A853" d="M8 16c2.2 0 4-.7 5.3-2l-2.6-2c-.7.5-1.6.8-2.7.8-2.1 0-3.9-1.4-4.5-3.3H.8v2.1C2.1 14.2 4.8 16 8 16z"/><path fill="#FBBC05" d="M3.5 9.5c-.2-.5-.3-1-.3-1.5s.1-1 .3-1.5V4.4H.8C.3 5.5 0 6.7 0 8s.3 2.5.8 3.6l2.7-2.1z"/><path fill="#EA4335" d="M8 3.2c1.2 0 2.2.4 3.1 1.2l2.3-2.3C12 .8 10.2 0 8 0 4.8 0 2.1 1.8.8 4.4l2.7 2.1C4.1 4.6 5.9 3.2 8 3.2z"/></svg>
      <span data-i18n="login_google_btn"></span>
    </button>
  </div>
</main>

<script src="/translations.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://nrrhvbxvkizvkcwwglck.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycmh2Ynh2a2l6dmtjd3dnbGNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU3NDAsImV4cCI6MjEwMzA0MTc0MH0.S_M4KyTt4E_UG0ue-T-h89L17yxJKkmb36ZzNRdQnLI";
  const client = supabase.createClient(SUPABASE_URL, ANON_KEY);

  function updateFlagActiveState() {
    const lang = getCurrentLanguage();
    document.getElementById('flagFi').classList.toggle('active', lang === 'fi');
    document.getElementById('flagEn').classList.toggle('active', lang === 'en');
  }

  function setLoginLanguage(lang) {
    setCurrentLanguage(lang);
    applyStaticTranslations();
    updateFlagActiveState();
  }

    let sessionToken = null;

  async function checkAccessAndRedirect() {
    const { data: { session } } = await client.auth.getSession();
    sessionToken = session.access_token;

    const res = await fetch(`${SUPABASE_URL}/functions/v1/check-app-access`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + sessionToken,
      },
    });
    const data = await res.json();

    if (!data.authorized) {
      await client.auth.signOut();
      document.getElementById('status').textContent = t('no_app_access');
      return;
    }

    const profileRes = await fetch(`${SUPABASE_URL}/functions/v1/get-my-profile`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + sessionToken,
      },
    });
    const profileData = await profileRes.json();

    if (!profileData.profileCompleted) {
      showFirstLoginProfilePopup(data.organizationName || null);
      return;
    }

    window.location.href = takeReturnPath();
  }

  function showFirstLoginProfilePopup(organizationName) {
    const orgFieldHtml = organizationName
      ? `<input type="text" id="fpOrganization" value="${organizationName.replace(/"/g, '&quot;')}" disabled />`
      : `<input type="text" id="fpOrganization" />`;

    document.body.insertAdjacentHTML('beforeend', `
      <div id="profilePopupOverlay" class="modal-overlay">
        <div class="modal-card">
          <h3>${t('complete_profile_heading')}</h3>
          <div class="field"><label for="fpFirstName">${t('first_name_label')}</label><input type="text" id="fpFirstName" /></div>
          <div class="field"><label for="fpLastName">${t('last_name_label')}</label><input type="text" id="fpLastName" /></div>
          <div class="field"><label for="fpTitle">${t('title_label')}</label><input type="text" id="fpTitle" /></div>
          <div class="field"><label for="fpOrganization">${t('organization_label')}</label>${orgFieldHtml}</div>
          <div class="field"><label for="fpTeam">${t('team_label')}</label><input type="text" id="fpTeam" /></div>
          <div class="btn-row">
            <button onclick="submitFirstLoginProfile('${organizationName ? organizationName.replace(/'/g, "\\'") : ''}')">${t('save_and_continue_btn')}</button>
          </div>
        </div>
      </div>
    `);
  }

  async function submitFirstLoginProfile(lockedOrganizationName) {
    const body = {
      firstName: document.getElementById('fpFirstName').value,
      lastName: document.getElementById('fpLastName').value,
      title: document.getElementById('fpTitle').value,
      organization: lockedOrganizationName || document.getElementById('fpOrganization').value,
      team: document.getElementById('fpTeam').value,
      language: getCurrentLanguage(),
    };

    await fetch(`${SUPABASE_URL}/functions/v1/update-my-profile`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': ANON_KEY,
        'Authorization': 'Bearer ' + sessionToken,
      },
      body: JSON.stringify(body),
    });

    window.location.href = takeReturnPath();
  }

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const { data, error } = await client.auth.signInWithPassword({ email, password });

    if (error) {
      document.getElementById('status').textContent = t('error_prefix') + ': ' + error.message;
      return;
    }

    await checkAccessAndRedirect();
  }

  function loginWithMicrosoft() {
    client.auth.signInWithOAuth({
      provider: 'azure',
      options: {
        scopes: 'email',
        redirectTo: window.location.origin + '/login.html',
      },
    });
  }

  function loginWithGoogle() {
    client.auth.signInWithOAuth({
      provider: 'google',
      options: {
        scopes: 'email',
        redirectTo: window.location.origin + '/login.html',
      },
    });
  }

  // Paluu alkuperäiselle sivulle (esim. istunto vanhentunut -ikkunasta ?next=/projekti.html?id=…).
  // Talletetaan sessionStorageen, jotta osoite säilyy Microsoft/Google-kirjautumisen
  // uudelleenohjauksen yli. Vain saman sivuston polut kelpaavat. Tarkistus tehdään selaimen
  // omalla URL-jäsentimellä, koska selain tulkitsee esim. "/\x.fi" ja "/<sarkain>/x.fi" muotoon "//x.fi".
  const RETURN_KEY = 'meetsko_return_path';
  function isSafeReturnPath(path) {
    if (typeof path !== 'string' || !path.startsWith('/') || /[\\\u0000-\u001f]/.test(path)) return false;
    let url;
    try { url = new URL(path, window.location.origin); } catch (e) { return false; }
    return url.origin === window.location.origin && url.pathname !== '/login.html' && url.pathname !== '/login';
  }
  (() => {
    const next = new URLSearchParams(window.location.search).get('next');
    try { if (isSafeReturnPath(next)) sessionStorage.setItem(RETURN_KEY, next); } catch (e) {}
  })();
  function takeReturnPath() {
    let path = null;
    try { path = sessionStorage.getItem(RETURN_KEY); sessionStorage.removeItem(RETURN_KEY); } catch (e) {}
    return isSafeReturnPath(path) ? path : '/projektit.html';
  }

  applyStaticTranslations();
  updateFlagActiveState();

  (async () => {
    const { data: { session } } = await client.auth.getSession();
    if (session) {
      await checkAccessAndRedirect();
    }
  })();
</script>

</body>
</html>
