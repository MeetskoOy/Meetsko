<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meetsko — Omat projektit</title>
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='36' height='36' rx='8' fill='%231B3A6B'/%3E%3Crect x='24' y='24' width='36' height='36' rx='8' fill='%238FB3E8'/%3E%3Cpath d='M24 32A8 8 0 0 1 32 24H40V32A8 8 0 0 1 32 40H24Z' fill='%232BB39A'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/app.css" />
<style>
  .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .project-card { position: relative; display: flex; flex-direction: column; gap: 14px; min-height: 132px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; box-sizing: border-box; transition: border-color 0.15s, box-shadow 0.15s; }
  .project-card:hover { border-color: var(--primary); box-shadow: 0 4px 14px rgba(15,27,45,0.08); }
  .project-card .pc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .project-card .pc-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; flex: 0 0 36px; }
  .project-card .pc-icon svg { width: 18px; height: 18px; }
  .project-card .pc-name { font-size: 16px; font-weight: 600; line-height: 1.3; word-break: break-word; }
  .project-card .pc-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
  .project-card .pc-meta { font-family: var(--mono); font-size: 12px; color: var(--text-muted); }
  .project-card .pc-arrow { color: var(--text-faint); transition: transform 0.15s, color 0.15s; }
  .project-card:hover .pc-arrow { color: var(--primary); transform: translateX(3px); }
  .owner-missing-flag { font-size: 11.5px; font-weight: 600; color: #9C2C22; background: var(--danger-soft); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .involved-badge { font-size: 11.5px; font-weight: 600; color: var(--ok); background: var(--ok-soft); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }

  .no-projects { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 28px; max-width: 720px; }
  .no-projects h2 { font-size: 20px; margin: 0 0 8px; }
  .no-projects > p { margin: 0; font-size: 15px; color: var(--text-muted); line-height: 1.55; }
  .no-projects .np-box { margin-top: 20px; padding: 16px 18px; border-radius: 10px; background: var(--primary-soft); font-size: 14px; line-height: 1.55; }
  .no-projects .np-box.promo { background: var(--ok-soft); }
  .no-projects .np-box strong { display: block; margin-bottom: 4px; color: var(--text); }
  .no-projects .np-box ul { margin: 8px 0 0; padding-left: 18px; }
  .no-projects .np-box a { color: var(--primary); font-weight: 600; }
  .no-projects .np-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .empty-state { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 22px 24px; border: 1px dashed #CDD3DB; border-radius: 12px; background: var(--surface); color: var(--text-muted); font-size: 14px; }
  .loading-note { color: var(--text-faint); font-size: 14px; }
</style>
</head>
<body>

<div id="appNav"></div>

<main class="page">
  <div class="page-head">
    <div>
      <h1 data-i18n="nav_projects"></h1>
      <p class="page-sub" id="pageSub"></p>
    </div>
    <div class="head-actions">
      <a class="btn" id="newProjectBtn" href="/uusiprojekti.html" data-i18n="new_project_link" style="display:none;"></a>
    </div>
  </div>

  <div id="content"><p class="loading-note" data-i18n="loading"></p></div>
</main>

<script src="/translations.js"></script>
<script src="/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://nrrhvbxvkizvkcwwglck.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycmh2Ynh2a2l6dmtjd3dnbGNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU3NDAsImV4cCI6MjEwMzA0MTc0MH0.S_M4KyTt4E_UG0ue-T-h89L17yxJKkmb36ZzNRdQnLI";
  const client = supabase.createClient(SUPABASE_URL, ANON_KEY);
  let myProfileData = null;

  // Istunto: tuore token ennen jokaista kutsua, vanhentuneesta istunnosta oma ikkuna (nav.js, bugi 3).
  AppNav.initSession({ client, url: SUPABASE_URL, anonKey: ANON_KEY });
  AppNav.mount('projects');

  async function ensureLoggedIn() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      window.location.href = '/login.html?next=' + encodeURIComponent(window.location.pathname + window.location.search);
      return false;
    }
    return true;
  }

  async function logout() {
    await client.auth.signOut();
    window.location.href = '/login.html';
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  const PROJECT_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5.5 1.8v2.4M10.5 1.8v2.4"/></svg>';
  const ARROW_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';

  function projectCardHtml(p, showBadge) {
    const created = new Date(p.created_at).toLocaleDateString(getCurrentLanguage() === 'en' ? 'en-GB' : 'fi-FI');
    const badge = showBadge && p.involved ? `<span class="involved-badge">${t('involved_badge')}</span>` : '';
    // Vastuuhenkilö puuttuu, kun hänet on poistettu Meetskosta eikä projektissa ollut muita ylläpitäjiä.
    const ownerFlag = 'owner_email' in p && !p.owner_email ? `<span class="owner-missing-flag">${t('owner_missing')}</span>` : '';
    return `
      <a class="project-card" href="/projekti.html?id=${encodeURIComponent(p.id)}">
        <div class="pc-top">
          <span class="pc-icon">${PROJECT_ICON}</span>
          ${ownerFlag || badge}
        </div>
        <div class="pc-name">${escapeHtml(p.name)}</div>
        <div class="pc-foot">
          <span class="pc-meta">${t('created_label')} ${created}</span>
          <span class="pc-arrow">${ARROW_ICON}</span>
        </div>
      </a>
    `;
  }

  function sectionHtml(title, projects, showBadge, emptyText, emptyWithButton) {
    let html = `<h2 class="section-title">${title}<span class="count">${projects.length}</span></h2>`;
    if (projects.length === 0) {
      const btn = emptyWithButton && canCreateProjects() ? `<a class="btn secondary" href="/uusiprojekti.html">${t('new_project_link')}</a>` : '';
      html += `<div class="empty-state"><span>${emptyText}</span>${btn}</div>`;
    } else {
      html += `<div class="project-grid">${projects.map((p) => projectCardHtml(p, showBadge)).join('')}</div>`;
    }
    return html;
  }

  async function loadProjects() {
    const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/list-projects`, {
      method: 'POST',
    });
    const data = await res.json();
    const content = document.getElementById('content');

    if (data.error) {
      content.innerHTML = `<div class="empty-state">${t('error_prefix')}: ${escapeHtml(data.error)}</div>`;
      return;
    }

    if (data.isSuperadmin) {
      const all = data.projects || [];
      document.getElementById('pageSub').textContent = t('meta_projects_count', { count: all.length });
      content.innerHTML = sectionHtml(t('back_all_projects'), all, false, t('empty_no_projects'), false);
      return;
    }

    const own = data.groupOwnInvolved || [];
    const orgAll = data.groupOwnOrgAll || [];
    const others = data.groupOtherOrgsInvolved || [];
    document.getElementById('pageSub').textContent = t('meta_projects_count', { count: own.length + others.length });

    // Ei yhtään projektia eikä luontioikeutta: kerrotaan, miten pääsee mukaan.
    if (own.length === 0 && others.length === 0 && !data.isOrgSuperuser && !canCreateProjects()) {
      content.innerHTML = noProjectsHtml();
      return;
    }

    let html = sectionHtml(t('section_own_projects'), own, false, t('empty_not_involved'), true);
    if (data.isOrgSuperuser && data.ownOrganizationName) {
      html += sectionHtml(`${escapeHtml(data.ownOrganizationName)} — ${t('section_org_all_projects')}`, orgAll, true, t('empty_org_no_projects'), false);
    }
    if (others.length > 0) {
      html += sectionHtml(t('section_other_orgs_projects'), others, false, '', false);
    }
    content.innerHTML = html;
  }

  async function setLanguagePref(lang) {
    setCurrentLanguage(lang);
    if (myProfileData) {
      await AppNav.fetch(`${SUPABASE_URL}/functions/v1/update-my-profile`, {
        method: 'POST',
        body: JSON.stringify({
          firstName: myProfileData.firstName,
          lastName: myProfileData.lastName,
          title: myProfileData.title,
          organization: myProfileData.organization,
          team: myProfileData.team,
          language: lang,
        }),
      });
    }
    window.location.reload();
  }

  async function loadMyProfileAndTranslations() {
    const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/get-my-profile`, {
      method: 'POST',
    });
    const data = await res.json();
    if (data.error) {
      applyStaticTranslations();
      return;
    }

    myProfileData = data;
    setCurrentLanguage(data.language || 'fi');
    applyStaticTranslations();
    AppNav.setProfile(data);
    document.getElementById('newProjectBtn').style.display = canCreateProjects() ? '' : 'none';
  }

  // Meetskon yhteystieto projektittomien vieraiden ohjeessa.
  const MEETSKO_CONTACT_EMAIL = 'support@meetsko.com';

  // Projektiton käyttäjä: organisaation käyttäjälle pääkäyttäjien yhteystiedot
  // projektinluontioikeutta varten, vieraalle esittely ja Meetskon yhteystieto.
  function noProjectsHtml() {
    const p = myProfileData || {};
    let box = '';
    if (p.appRole === 'user') {
      const admins = (p.organizationAdmins || []).map((a) =>
        `<li>${escapeHtml(a.name || a.email)} – <a href="mailto:${escapeHtml(a.email)}">${escapeHtml(a.email)}</a></li>`).join('');
      box = `
        <div class="np-box">
          <strong>${t('np_create_right_heading')}</strong>
          ${t('np_create_right_body', { org: escapeHtml(p.appOrganizationName || '') })}
          ${admins ? `<ul>${admins}</ul>` : ''}
        </div>`;
    } else {
      box = `
        <div class="np-box promo">
          <strong>${t('np_promo_heading')}</strong>
          ${t('np_promo_body')}
          <div class="np-actions">
            <a href="https://meetsko.com/" target="_blank" rel="noopener">${t('np_promo_link')} →</a>
            <span>${t('np_promo_contact')} <a href="mailto:${MEETSKO_CONTACT_EMAIL}">${MEETSKO_CONTACT_EMAIL}</a></span>
          </div>
        </div>`;
    }
    return `
      <div class="no-projects">
        <h2>${t('np_heading')}</h2>
        <p>${t('np_body')}</p>
        ${box}
      </div>`;
  }

  // Uusi projekti -napit vain luontioikeudella (get-my-profile, sama ehto kuin create-project).
  function canCreateProjects() {
    return !!myProfileData && myProfileData.canCreateProjects !== false;
  }

  (async () => {
    const ok = await ensureLoggedIn();
    if (ok) {
      await loadMyProfileAndTranslations();
      loadProjects();
    }
  })();
</script>
</body>
</html>
