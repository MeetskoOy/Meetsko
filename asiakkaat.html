<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meetsko — Asiakkaat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='36' height='36' rx='8' fill='%231B3A6B'/%3E%3Crect x='24' y='24' width='36' height='36' rx='8' fill='%238FB3E8'/%3E%3Cpath d='M24 32A8 8 0 0 1 32 24H40V32A8 8 0 0 1 32 40H24Z' fill='%232BB39A'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/app.css" />
<style>
  .list-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .list-row { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-top: 1px solid var(--line-soft); cursor: pointer; transition: background 0.12s; }
  .list-row:first-child { border-top: none; }
  .list-row:hover { background: var(--surface-muted); }
  .list-row .lr-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; flex: 0 0 36px; }
  .list-row .lr-icon svg { width: 18px; height: 18px; }
  .list-row .lr-main { flex: 1; min-width: 0; }
  .list-row .lr-name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .list-row .lr-meta { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
  .list-row .lr-arrow { color: var(--text-faint); }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
  .badge.domain { background: var(--ok-soft); color: var(--ok); }
  .badge.restricted { background: var(--primary-soft); color: var(--primary); }
  .empty-state { padding: 22px 24px; border: 1px dashed #CDD3DB; border-radius: 12px; background: var(--surface); color: var(--text-muted); font-size: 14px; }

  .form-scope input[type=text], .form-scope input[type=email] { width: 100%; }
  .field { margin-bottom: 18px; }
  .radio-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .radio-row label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--text); font-weight: 400; font-size: 14px; }
  .repeat-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .repeat-row input { flex: 1; }
  .danger-zone { border-top: 1px solid var(--line-soft); margin-top: 24px; padding-top: 18px; }

  .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .project-card { display: flex; flex-direction: column; gap: 8px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; transition: border-color 0.15s, box-shadow 0.15s; }
  .project-card:hover { border-color: var(--primary); box-shadow: 0 4px 14px rgba(15,27,45,0.08); }
  .project-card .name { font-weight: 600; font-size: 15px; }
  .project-card .meta { color: var(--text-muted); font-size: 12.5px; }
  .project-card .meta.mono { font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>

<div id="appNav"></div>

<main class="page form-scope">
  <a class="back" id="backLink" href="/projektit.html">&larr; <span data-i18n="back_all_projects"></span></a>
  <div class="page-head">
    <div>
      <h1 id="pageTitle" data-i18n="heading_clients"></h1>
      <p class="page-sub" id="pageSub" data-i18n="sub_clients"></p>
    </div>
    <div class="head-actions" id="pageActions"></div>
  </div>

  <div id="app"><p class="note" data-i18n="loading"></p></div>
</main>

<script src="/translations.js"></script>
<script src="/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://nrrhvbxvkizvkcwwglck.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycmh2Ynh2a2l6dmtjd3dnbGNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU3NDAsImV4cCI6MjEwMzA0MTc0MH0.S_M4KyTt4E_UG0ue-T-h89L17yxJKkmb36ZzNRdQnLI";
  const client = supabase.createClient(SUPABASE_URL, ANON_KEY);

  let currentAccessToken = null;
  let organizations = [];
  let superuserEmails = [''];
  let memberEmails = [''];
  let editingOrgId = null;
  let myProfileData = null;

  AppNav.mount('clients');

  const ORG_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2.5 14V3.5l5-2v12.5M7.5 6h6v8M2 14h12M4.5 5.5h1M4.5 8h1M4.5 10.5h1M10 8.5h1M10 11h1"/></svg>';
  const ARROW_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg>';

  function escapeHtml(str) {
    return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Sivun otsikkoalue vaihtuu näkymän mukaan (lista / lomake / asiakkaan tiedot).
  function setHeader({ title, sub = '', actionsHtml = '', backToList = false }) {
    document.getElementById('pageTitle').textContent = title;
    const subEl = document.getElementById('pageSub');
    subEl.textContent = sub;
    subEl.style.display = sub ? '' : 'none';
    document.getElementById('pageActions').innerHTML = actionsHtml;
    const back = document.getElementById('backLink');
    if (backToList) {
      back.href = '#';
      back.onclick = (e) => { e.preventDefault(); renderList(); };
      back.innerHTML = `&larr; ${t('all_clients_back')}`;
    } else {
      back.href = '/projektit.html';
      back.onclick = null;
      back.innerHTML = `&larr; ${t('back_all_projects')}`;
    }
  }

  async function logout() {
    await client.auth.signOut();
    window.location.href = '/login.html';
  }

  async function setLanguagePref(lang) {
    setCurrentLanguage(lang);
    if (myProfileData) {
      await fetch(`${SUPABASE_URL}/functions/v1/update-my-profile`, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({
          firstName: myProfileData.firstName,
          lastName: myProfileData.lastName,
          title: myProfileData.title,
          organization: myProfileData.organization,
          team: myProfileData.team,
          language: lang,
        }),
      });
    }
    window.location.reload();
  }

  async function loadMyProfileAndTranslations() {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-my-profile`, {
      method: 'POST',
      headers: authHeaders(),
    });
    const data = await res.json();
    if (!data.error) {
      myProfileData = data;
      setCurrentLanguage(data.language || 'fi');
    }
    applyStaticTranslations();
    if (!data.error) AppNav.setProfile(data);
  }

  function authHeaders() {
    return {
      'Content-Type': 'application/json',
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + currentAccessToken,
    };
  }

  async function ensureLoggedIn() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      window.location.href = '/login.html';
      return false;
    }
    currentAccessToken = session.access_token;
    return true;
  }

  async function loadOrganizations() {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/list-organizations`, {
      method: 'POST',
      headers: authHeaders(),
    });
    const data = await res.json();

    if (data.error) {
      document.getElementById('app').innerHTML = `<div class="empty-state">${t('error_prefix')}: ${escapeHtml(data.error)}</div>`;
      return;
    }

    organizations = data.organizations;
    renderList();
  }

  function renderList() {
    editingOrgId = null;
    const app = document.getElementById('app');

    setHeader({
      title: t('heading_clients'),
      sub: t('sub_clients'),
      actionsHtml: `<button onclick="showCreateForm()">${t('new_client_link')}</button>`,
    });

    if (organizations.length === 0) {
      app.innerHTML = `<div class="empty-state">${t('empty_no_clients')}</div>`;
      return;
    }

    app.innerHTML = `<div class="list-panel">${organizations.map((o) => {
      const badge = o.access_mode === 'domain'
        ? `<span class="badge domain">${t('badge_domain')}: ${escapeHtml(o.email_domain)}</span>`
        : `<span class="badge restricted">${t('badge_restricted')}</span>`;
      const superuserCount = o.members.filter((m) => m.role === 'superuser').length;
      return `
        <div class="list-row" onclick="openOrganization('${o.id}')">
          <span class="lr-icon">${ORG_ICON}</span>
          <div class="lr-main">
            <div class="lr-name">${escapeHtml(o.name)}${badge}</div>
            <div class="lr-meta">${superuserCount} ${t('superusers_count_label')} · ${o.members.length} ${t('members_listed_label')}</div>
          </div>
          <span class="lr-arrow">${ARROW_ICON}</span>
        </div>
      `;
    }).join('')}</div>`;
  }

  function showCreateForm() {
    editingOrgId = null;
    superuserEmails = [''];
    memberEmails = [''];
    renderOrgForm({ name: '', access_mode: 'restricted', email_domain: '' });
  }

  function renderOrgForm(org) {
    const app = document.getElementById('app');
    const isEdit = !!editingOrgId;

    const superuserRows = superuserEmails.map((val, idx) => `
      <div class="repeat-row">
        <input type="email" value="${escapeHtml(val)}" placeholder="paakayttaja@yritys.fi" onchange="updateSuperuser(${idx}, this.value)" />
        <button type="button" class="icon-remove" onclick="removeSuperuser(${idx})">✕</button>
      </div>
    `).join('');

    const memberRows = memberEmails.map((val, idx) => `
      <div class="repeat-row">
        <input type="email" value="${escapeHtml(val)}" placeholder="kayttaja@yritys.fi" onchange="updateMember(${idx}, this.value)" />
        <button type="button" class="icon-remove" onclick="removeMember(${idx})">✕</button>
      </div>
    `).join('');

    setHeader({ title: isEdit ? t('edit_client_heading') : t('new_client_heading'), backToList: true });

    app.innerHTML = `
      <div class="card-section" style="max-width:720px;">
        <div class="field">
          <label for="orgName">${t('client_name_label')}</label>
          <input type="text" id="orgName" value="${escapeHtml(org.name)}" />
        </div>

        <div class="field">
          <label>${t('access_scope_label')}</label>
          <div class="radio-row">
            <label><input type="radio" name="accessMode" value="restricted" ${org.access_mode !== 'domain' ? 'checked' : ''} onchange="toggleDomainField()" /> ${t('restricted_option')}</label>
            <label><input type="radio" name="accessMode" value="domain" ${org.access_mode === 'domain' ? 'checked' : ''} onchange="toggleDomainField()" /> ${t('domain_option')}</label>
          </div>
        </div>

        <div class="field" id="domainFieldWrap" style="display:${org.access_mode === 'domain' ? 'block' : 'none'};">
          <label for="emailDomain">${t('email_domain_label')}</label>
          <input type="text" id="emailDomain" value="${escapeHtml(org.email_domain || '')}" />
        </div>

        <div class="field">
          <label>${t('superusers_label')}</label>
          <div id="superuserRows">${superuserRows}</div>
          <button type="button" class="secondary small" onclick="addSuperuser()">${t('add_superuser_btn')}</button>
        </div>

        <div class="field">
          <label>${t('other_members_label')}</label>
          <div id="memberRows">${memberRows}</div>
          <button type="button" class="secondary small" onclick="addMember()">${t('add_member_btn')}</button>
        </div>

        <div class="btn-row">
          <button class="secondary" onclick="renderList()">${t('cancel')}</button>
          <button onclick="${isEdit ? 'submitOrganizationEdit()' : 'submitOrganization()'}">${isEdit ? t('save_changes_btn') : t('create_client_btn')}</button>
        </div>

        ${isEdit ? `
          <div class="danger-zone">
            <button class="danger" type="button" onclick="deleteOrganization()">${t('delete_client_btn')}</button>
          </div>
        ` : ''}
      </div>
    `;
  }

  function toggleDomainField() {
    const mode = document.querySelector('input[name="accessMode"]:checked').value;
    document.getElementById('domainFieldWrap').style.display = mode === 'domain' ? 'block' : 'none';
  }

  function addSuperuser() { superuserEmails.push(''); rerenderCurrentForm(); }
  function removeSuperuser(idx) { superuserEmails.splice(idx, 1); if (superuserEmails.length === 0) superuserEmails = ['']; rerenderCurrentForm(); }
  function updateSuperuser(idx, val) { superuserEmails[idx] = val; }

  function addMember() { memberEmails.push(''); rerenderCurrentForm(); }
  function removeMember(idx) { memberEmails.splice(idx, 1); if (memberEmails.length === 0) memberEmails = ['']; rerenderCurrentForm(); }
  function updateMember(idx, val) { memberEmails[idx] = val; }

  function currentFormValues() {
    return {
      name: document.getElementById('orgName').value,
      access_mode: document.querySelector('input[name="accessMode"]:checked').value,
      email_domain: document.getElementById('emailDomain') ? document.getElementById('emailDomain').value : '',
    };
  }

  function rerenderCurrentForm() {
    const values = currentFormValues();
    renderOrgForm(values);
  }

  async function submitOrganization() {
    const name = document.getElementById('orgName').value.trim();
    const accessMode = document.querySelector('input[name="accessMode"]:checked').value;
    const emailDomain = accessMode === 'domain' ? document.getElementById('emailDomain').value.trim() : null;
    const superusers = superuserEmails.map((e) => e.trim()).filter((e) => e !== '');
    const members = memberEmails.map((e) => e.trim()).filter((e) => e !== '');

    if (!name) { alert(t('alert_client_name_required')); return; }
    if (superusers.length === 0) { alert(t('alert_superuser_required')); return; }
    if (accessMode === 'domain' && !emailDomain) { alert(t('alert_domain_required')); return; }

    let itContactEmail = '';
    const allDomains = new Set();
    if (accessMode === 'domain') {
      allDomains.add(emailDomain);
    } else {
      [...superusers, ...members].forEach((e) => {
        const d = e.split('@')[1];
        if (d) allDomains.add(d.toLowerCase());
      });
    }

    const checkRes = await fetch(`${SUPABASE_URL}/functions/v1/check-new-domains`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ emails: Array.from(allDomains).map((d) => 'x@' + d) }),
    });
    const checkData = await checkRes.json();

    if (checkData.newDomains && checkData.newDomains.length > 0) {
      itContactEmail = prompt(t('new_domain_prompt', { domains: checkData.newDomains.join(', ') })) || '';
    }

    const res = await fetch(`${SUPABASE_URL}/functions/v1/create-organization`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ name, accessMode, emailDomain, superusers, members, itContactEmail }),
    });
    const data = await res.json();

    if (data.error) { alert(t('error_prefix') + ': ' + data.error); return; }

    alert(t('client_created_alert') + (accessMode === 'restricted' ? t('and_named_members') : '.'));

    await loadOrganizations();
  }

  async function submitOrganizationEdit() {
    const name = document.getElementById('orgName').value.trim();
    const accessMode = document.querySelector('input[name="accessMode"]:checked').value;
    const emailDomain = accessMode === 'domain' ? document.getElementById('emailDomain').value.trim() : null;
    const superusers = superuserEmails.map((e) => e.trim()).filter((e) => e !== '');
    const members = memberEmails.map((e) => e.trim()).filter((e) => e !== '');

    if (!name) { alert(t('alert_client_name_required')); return; }
    if (superusers.length === 0) { alert(t('alert_superuser_required')); return; }
    if (accessMode === 'domain' && !emailDomain) { alert(t('alert_domain_required')); return; }

    const res = await fetch(`${SUPABASE_URL}/functions/v1/update-organization`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ organizationId: editingOrgId, name, accessMode, emailDomain, superusers, members }),
    });
    const data = await res.json();

    if (data.error) { alert(t('error_prefix') + ': ' + data.error); return; }

    await loadOrganizations();
  }

  async function deleteOrganization() {
    const org = organizations.find((o) => o.id === editingOrgId);
    if (!org) return;

    const confirm1 = confirm(t('confirm_delete_client', { name: org.name }));
    if (!confirm1) return;

    const res = await fetch(`${SUPABASE_URL}/functions/v1/delete-organization`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ organizationId: editingOrgId }),
    });
    const data = await res.json();

    if (data.error) { alert(t('error_prefix') + ': ' + data.error); return; }

    await loadOrganizations();
  }

  function startEditOrganization() {
    const org = organizations.find((o) => o.id === editingOrgId);
    if (!org) return;

    superuserEmails = org.members.filter((m) => m.role === 'superuser').map((m) => m.email);
    if (superuserEmails.length === 0) superuserEmails = [''];

    memberEmails = org.members.filter((m) => m.role !== 'superuser').map((m) => m.email);
    if (memberEmails.length === 0) memberEmails = [''];

    renderOrgForm(org);
  }

  async function openOrganization(orgId) {
    const org = organizations.find((o) => o.id === orgId);
    if (!org) return;
    editingOrgId = orgId;

    const app = document.getElementById('app');
    setHeader({
      title: org.name,
      sub: `${t('superusers_prefix')}: ${org.members.filter((m) => m.role === 'superuser').map((m) => m.email).join(', ') || '–'}`,
      actionsHtml: `<button class="secondary" onclick="startEditOrganization()">${t('edit_client_btn')}</button>`,
      backToList: true,
    });
    app.innerHTML = `
      <h2 class="section-title">${t('projects_label')}</h2>
      <div id="orgProjects"><p class="note">${t('loading')}</p></div>
    `;

    const res = await fetch(`${SUPABASE_URL}/functions/v1/list-projects`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ organizationId: orgId }),
    });
    const data = await res.json();

    const projList = document.getElementById('orgProjects');
    if (data.error) {
      projList.innerHTML = `<div class="empty-state">${t('error_prefix')}: ${escapeHtml(data.error)}</div>`;
      return;
    }
    if (!data.projects || data.projects.length === 0) {
      projList.innerHTML = `<div class="empty-state">${t('empty_no_client_projects')}</div>`;
      return;
    }

    const locale = getCurrentLanguage() === 'en' ? 'en-GB' : 'fi-FI';
    projList.innerHTML = `<div class="project-grid">${data.projects.map((p) => `
      <a class="project-card" href="/projekti.html?id=${encodeURIComponent(p.id)}">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="meta">${t('responsible_person')} ${escapeHtml(p.owner_email)}</div>
        <div class="meta mono">${t('created_label')} ${new Date(p.created_at).toLocaleDateString(locale)}</div>
      </a>
    `).join('')}</div>`;
  }

  (async () => {
    const ok = await ensureLoggedIn();
    if (ok) {
      await loadMyProfileAndTranslations();
      loadOrganizations();
    }
  })();
</script>

</body>
</html>
