<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meetsko — Uusi projekti</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='36' height='36' rx='8' fill='%231B3A6B'/%3E%3Crect x='24' y='24' width='36' height='36' rx='8' fill='%238FB3E8'/%3E%3Cpath d='M24 32A8 8 0 0 1 32 24H40V32A8 8 0 0 1 32 40H24Z' fill='%232BB39A'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/app.css" />
<style>
  .form-scope input[type=text], .form-scope input[type=email] { width: 100%; }
  .client-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .client-row input { flex: 1; }

  .member-header, .member-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1.4fr 130px 28px; gap: 8px; align-items: center; }
  .member-header { font-size: 12px; font-weight: 500; color: var(--text-faint); margin-bottom: 6px; }
  .member-row { margin-bottom: 8px; }
  .member-row select { width: 100%; }

  .add-row { margin-top: 6px; }
  .myself-row { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-soft); }

  .invite-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .invite-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 13.5px; display: flex; flex-direction: column; gap: 6px; }
  .invite-card .email { font-weight: 600; }
  .invite-card a { word-break: break-all; color: var(--primary); font-family: var(--mono); font-size: 12px; }

  .domain-row { border-top: 1px solid var(--line-soft); padding: 14px 0; }
  .domain-row:first-of-type { border-top: none; padding-top: 4px; }
  .domain-row .domain-name { font-weight: 600; font-size: 14px; margin-bottom: 8px; }

  @media (max-width: 760px) {
    .member-header { display: none; }
    .member-row { grid-template-columns: 1fr 1fr; padding-bottom: 10px; border-bottom: 1px solid var(--line-soft); }
  }
</style>
</head>
<body>

<div id="appNav"></div>

<main class="page narrow form-scope">
  <a class="back" href="/projektit.html">&larr; <span data-i18n="back_all_projects"></span></a>
  <div class="page-head">
    <h1 data-i18n="heading_new_project"></h1>
  </div>

  <div id="noPermission" class="banner error" style="display:none;" data-i18n="no_project_create_permission"></div>

  <div id="formStep">
    <div class="card-section">
      <label for="projectName" data-i18n="project_name_label"></label>
      <input type="text" id="projectName" data-i18n-placeholder="project_name_placeholder" />
      <!-- Superadmin valitsee omistavan organisaation; muilla se on oma organisaatio. -->
      <div id="orgPickerWrap" style="display:none; margin-top:18px;">
        <label for="orgPicker" data-i18n="owning_org_label"></label>
        <select id="orgPicker" style="width:100%;"></select>
        <p class="note" data-i18n="owning_org_note"></p>
      </div>
    </div>

    <div class="card-section">
      <h2 data-i18n="heading_client_orgs"></h2>
      <div id="clientRows">
        <div class="client-row">
          <input type="text" data-i18n-placeholder="client_name_placeholder" />
          <button type="button" class="icon-remove" onclick="removeClientRow(this)">✕</button>
        </div>
      </div>
      <button class="secondary small add-row" type="button" onclick="addClientRow()" data-i18n="add_new_btn"></button>
    </div>

    <div class="card-section">
      <h2 data-i18n="heading_project_members"></h2>
      <div class="member-header">
        <span data-i18n="col_first_name"></span><span data-i18n="col_last_name"></span><span data-i18n="col_title"></span><span data-i18n="col_email"></span><span data-i18n="col_role"></span><span></span>
      </div>
      <div id="memberRows">
        <div class="member-row">
          <input type="text" data-i18n-placeholder="col_first_name" />
          <input type="text" data-i18n-placeholder="col_last_name" />
          <input type="text" data-i18n-placeholder="col_title" />
          <input type="email" placeholder="sahkoposti@yritys.fi" />
          <select>
            <option value="guest" data-i18n="role_guest"></option>
            <option value="admin" data-i18n="role_admin"></option>
          </select>
          <button type="button" class="icon-remove" onclick="removeMemberRow(this)">✕</button>
        </div>
      </div>
      <button class="secondary small add-row" type="button" onclick="addMemberRow()" data-i18n="add_member_btn"></button>
      <div class="check-row myself-row">
        <input type="checkbox" id="addMyselfCheckbox" />
        <label for="addMyselfCheckbox" data-i18n="add_myself_checkbox_label"></label>
      </div>
    </div>

    <div class="btn-row">
      <button id="submitBtn" onclick="createProject()" data-i18n="create_project_btn"></button>
    </div>
    <div class="error-text" id="formError" style="text-align:right;"></div>
  </div>

  <div id="domainStep" style="display:none;"></div>

  <div id="result"></div>
</main>

<script src="/translations.js"></script>
<script src="/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://nrrhvbxvkizvkcwwglck.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycmh2Ynh2a2l6dmtjd3dnbGNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU3NDAsImV4cCI6MjEwMzA0MTc0MH0.S_M4KyTt4E_UG0ue-T-h89L17yxJKkmb36ZzNRdQnLI";
  const client = supabase.createClient(SUPABASE_URL, ANON_KEY);

  let pendingResultData = null;
  let myOwnEmail = null;
  let myOwnFirstName = '';
  let myOwnLastName = '';
  let myProfileData = null;

  // Istunto: tuore token ennen jokaista kutsua, vanhentuneesta istunnosta oma ikkuna (nav.js).
  AppNav.initSession({ client, url: SUPABASE_URL, anonKey: ANON_KEY });
  AppNav.mount('projects');

  async function ensureLoggedIn() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      window.location.href = '/login.html?next=' + encodeURIComponent(window.location.pathname + window.location.search);
      return false;
    }
    myOwnEmail = session.user.email;
    return true;
  }

  async function loadMyProfileAndTranslations() {
    const data = await AppNav.api('get-my-profile');
    if (data.error) {
      applyStaticTranslations();
      return;
    }
    myProfileData = data;
    myOwnFirstName = data.firstName || '';
    myOwnLastName = data.lastName || '';
    setCurrentLanguage(data.language || 'fi');
    applyStaticTranslations();
    AppNav.setProfile(data);
  }

  async function logout() {
    await client.auth.signOut();
    window.location.href = '/login.html';
  }

  async function setLanguagePref(lang) {
    setCurrentLanguage(lang);
    if (myProfileData) {
      await AppNav.api('update-my-profile', {
          firstName: myProfileData.firstName,
          lastName: myProfileData.lastName,
          title: myProfileData.title,
          organization: myProfileData.organization,
          team: myProfileData.team,
          language: lang,
        });
    }
    window.location.reload();
  }

  function addClientRow() {
    const div = document.createElement('div');
    div.className = 'client-row';
    div.innerHTML = `
      <input type="text" placeholder="${t('client_name_placeholder')}" />
      <button type="button" class="icon-remove" onclick="removeClientRow(this)">✕</button>
    `;
    document.getElementById('clientRows').appendChild(div);
  }

  function removeClientRow(btn) {
    const rows = document.getElementById('clientRows');
    if (rows.children.length > 1) btn.parentElement.remove();
  }

  function addMemberRow() {
    const div = document.createElement('div');
    div.className = 'member-row';
    div.innerHTML = `
      <input type="text" placeholder="${t('col_first_name')}" />
      <input type="text" placeholder="${t('col_last_name')}" />
      <input type="text" placeholder="${t('col_title')}" />
      <input type="email" placeholder="sahkoposti@yritys.fi" />
      <select>
        <option value="guest">${t('role_guest')}</option>
        <option value="admin">${t('role_admin')}</option>
      </select>
      <button type="button" class="icon-remove" onclick="removeMemberRow(this)">✕</button>
    `;
    document.getElementById('memberRows').appendChild(div);
  }

  function removeMemberRow(btn) {
    const rows = document.getElementById('memberRows');
    if (rows.children.length > 1) btn.parentElement.remove();
  }

  async function createProject() {
    const errorEl = document.getElementById('formError');
    errorEl.textContent = '';

    const name = document.getElementById('projectName').value.trim();
    if (!name) {
      errorEl.textContent = t('alert_project_name_required');
      return;
    }

    const clientOrganizations = Array.from(document.querySelectorAll('#clientRows .client-row input'))
      .map((el) => el.value.trim())
      .filter((v) => v !== '');

     const members = Array.from(document.querySelectorAll('#memberRows .member-row')).map((row) => {
      const inputs = row.querySelectorAll('input');
      const select = row.querySelector('select');
      return {
        firstName: inputs[0].value.trim(),
        lastName: inputs[1].value.trim(),
        title: inputs[2].value.trim(),
        email: inputs[3].value.trim(),
        role: select.value,
      };
    }).filter((m) => m.email !== '');

    if (document.getElementById('addMyselfCheckbox').checked) {
      const alreadyListed = members.some((m) => m.email.toLowerCase() === myOwnEmail.toLowerCase());
      if (!alreadyListed) {
        members.push({ firstName: myOwnFirstName, lastName: myOwnLastName, title: '', email: myOwnEmail, role: 'admin' });
      }
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = t('creating_label');

    try {
      const organizationId = myProfileData && myProfileData.isSuperadmin ? (document.getElementById('orgPicker').value || null) : null;
      const data = await AppNav.api('create-project', { name, clientOrganizations, members, organizationId });

      if (data.error) {
        errorEl.textContent = t('error_prefix') + ': ' + data.error;
        btn.disabled = false;
        btn.textContent = t('create_project_btn');
        return;
      }

      pendingResultData = data;
      document.getElementById('formStep').style.display = 'none';

      const memberEmails = members.map((m) => m.email);
      const checkData = await AppNav.api('check-new-domains', { emails: memberEmails });

      if (checkData.newDomains && checkData.newDomains.length > 0) {
        renderDomainStep(checkData.newDomains, data);
      } else {
        renderInviteResult(data);
      }
    } catch (err) {
      errorEl.textContent = t('unexpected_error') + ': ' + err.message;
      btn.disabled = false;
      btn.textContent = t('create_project_btn');
    }
  }

  function renderDomainStep(domains, data) {
    const domainRowsHtml = domains.map((d) => `
      <div class="domain-row" data-domain="${d}">
        <div class="domain-name">${d}</div>
        <label>${t('it_contact_label')}</label>
        <input type="email" class="it-contact-input" placeholder="it-tuki@${d}" style="width:100%;" />
      </div>
    `).join('');

    document.getElementById('domainStep').innerHTML = `
      <div class="card-section">
        <h2>${t('new_org_heading')}</h2>
        <p class="note" style="margin:0 0 12px;">${t('new_org_note')}</p>
        ${domainRowsHtml}
        <div class="btn-row">
          <button class="secondary" type="button" onclick="skipDomainStep()">${t('skip_btn')}</button>
          <button type="button" onclick="submitDomainStep()">${t('save_and_continue_btn')}</button>
        </div>
      </div>
    `;
    document.getElementById('domainStep').style.display = 'block';
  }

  async function saveDomainEntries(withContacts) {
    const rows = Array.from(document.querySelectorAll('#domainStep .domain-row')).map((row) => {
      const domain = row.getAttribute('data-domain');
      const itContactEmail = withContacts ? row.querySelector('.it-contact-input').value.trim() : '';
      return { domain, itContactEmail };
    });

    await AppNav.api('register-domain-contacts', { entries: rows, context: `project:${pendingResultData.project.id}` });
  }

  async function submitDomainStep() {
    await saveDomainEntries(true);
    document.getElementById('domainStep').style.display = 'none';
    renderInviteResult(pendingResultData);
  }

  async function skipDomainStep() {
    await saveDomainEntries(false);
    document.getElementById('domainStep').style.display = 'none';
    renderInviteResult(pendingResultData);
  }

  function renderInviteResult(data) {
    const resultEl = document.getElementById('result');
    let html = `<div class="banner ok">${t('project_created_heading', { name: data.project.name })}</div><div class="invite-list">`;

    data.invites.forEach((inv) => {
      if (inv.error) {
        html += `<div class="invite-card"><span class="email">${inv.email}</span><span class="status-pill warn">${t('error_prefix')}: ${inv.error}</span></div>`;
      } else {
        const statusHtml = inv.emailSent
          ? `<span class="status-pill ok">✓ ${t('email_sent_ok')}</span>`
          : `<span class="status-pill warn">${t('email_sent_fail')}</span>`;
        html += `<div class="invite-card"><span class="email">${inv.email}</span><a href="${inv.inviteLink}" target="_blank">${inv.inviteLink}</a><div>${statusHtml}</div></div>`;
      }
    });

    html += `</div><div class="btn-row"><button onclick="window.location.href='/projekti.html?id=${data.project.id}'">${t('go_to_project_btn')}</button></div>`;
    resultEl.innerHTML = html;
  }

  // Superadminin organisaatiovalitsin (list-organizations).
  async function loadOrganizationPicker() {
    const data = await AppNav.api('list-organizations');
    const picker = document.getElementById('orgPicker');
    const orgs = (data.organizations || []).slice().sort((a, b) => a.name.localeCompare(b.name, 'fi'));
    picker.innerHTML = `<option value="">${escapeHtmlAttr(t('owning_org_none'))}</option>`
      + orgs.map((o) => `<option value="${escapeHtmlAttr(o.id)}">${escapeHtmlAttr(o.name)}</option>`).join('');
    document.getElementById('orgPickerWrap').style.display = '';
  }

  function escapeHtmlAttr(str) {
    return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  (async () => {
    const ok = await ensureLoggedIn();
    if (!ok) return;
    await loadMyProfileAndTranslations();
    if (!myProfileData) return;
    if (myProfileData.canCreateProjects === false) {
      // Sama ehto kuin palvelimella (create-project): vain pääkäyttäjät ja projektien luojat.
      document.getElementById('formStep').style.display = 'none';
      document.getElementById('noPermission').style.display = '';
      return;
    }
    if (myProfileData.isSuperadmin) await loadOrganizationPicker();
  })();
</script>

</body>
</html>
