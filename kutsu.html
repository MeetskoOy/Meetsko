<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meetsko — Kutsu</title>
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='36' height='36' rx='8' fill='%231B3A6B'/%3E%3Crect x='24' y='24' width='36' height='36' rx='8' fill='%238FB3E8'/%3E%3Cpath d='M24 32A8 8 0 0 1 32 24H40V32A8 8 0 0 1 32 40H24Z' fill='%232BB39A'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/app.css" />
<style>
  .invite-wrap { display: flex; justify-content: center; padding: 56px 16px 60px; }
  #app { width: 520px; max-width: 100%; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 32px; box-shadow: 0 8px 30px rgba(15,27,45,0.06); box-sizing: border-box; }
  .card h1 { font-size: 24px; margin-bottom: 8px; }
  p.sub { color: var(--text-muted); font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
  .card button { width: 100%; margin: 8px 0 0; padding: 11px; font-weight: 600; }
  .form-scope .card input[type=text] { width: 100%; }
  .card label { margin-top: 14px; }
  .checkmark { color: var(--ok); font-size: 14px; font-weight: 500; margin: 8px 0; }

  h3 { font-size: 14px; font-weight: 600; margin: 22px 0 8px; }
  .day-block { border-top: 1px solid var(--line-soft); padding: 10px 0; }
  .day-toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; margin: 0; color: var(--text); }
  .card .day-toggle { margin-top: 0; }
  .ranges { margin: 8px 0 4px 24px; }
  .range-row, .blackout-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .form-scope .range-row input[type=time], .form-scope .blackout-row input[type=datetime-local] { padding: 6px 8px; font-size: 13px; }
  .card .remove-x { color: var(--danger); background: none; border: none; cursor: pointer; padding: 0 4px; width: auto; margin: 0; font-weight: 400; }
  .card .remove-x:hover { background: none; }
  .card .add-range-btn { width: auto; padding: 6px 12px; font-size: 12.5px; margin: 4px 0 0; font-weight: 500; }
  .fully-hidden-row { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-top: 18px; color: var(--text); }
  .empty-note { color: var(--text-faint); font-size: 12.5px; }
</style>
</head>
<body class="form-scope">

<header class="app-nav">
  <div class="app-nav-inner">
    <span class="brand">
      <svg width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><rect x="4" y="4" width="36" height="36" rx="8" fill="#FFFFFF"/><rect x="24" y="24" width="36" height="36" rx="8" fill="#8FB3E8"/><path d="M24 32A8 8 0 0 1 32 24H40V32A8 8 0 0 1 32 40H24Z" fill="#2BB39A"/></svg>
      Meetsko
    </span>
  </div>
</header>

<main class="invite-wrap">
  <div id="app"><div class="card"><p class="sub">…</p></div></div>
</main>

<script src="/translations.js"></script>
<script src="/dialogs.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://nrrhvbxvkizvkcwwglck.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycmh2Ynh2a2l6dmtjd3dnbGNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU3NDAsImV4cCI6MjEwMzA0MTc0MH0.S_M4KyTt4E_UG0ue-T-h89L17yxJKkmb36ZzNRdQnLI";
  const client = supabase.createClient(SUPABASE_URL, ANON_KEY);

  const CLIENT_ID = "54f922c6-aa24-44b4-9305-f28964c09f96";
  const CALENDAR_REDIRECT_URI = "https://nrrhvbxvkizvkcwwglck.supabase.co/functions/v1/auth-callback";

  function weekdayShortArr() {
    return ['weekday_short_mon','weekday_short_tue','weekday_short_wed','weekday_short_thu','weekday_short_fri','weekday_short_sat','weekday_short_sun'].map((k) => t(k));
  }

  let PID = null;
  let inviteInfo = null;
  let currentAccessToken = null;
  let settingsState = null;

  function authHeaders() {
    return {
      'Content-Type': 'application/json',
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + currentAccessToken,
    };
  }

  function app() {
    return document.getElementById('app');
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    PID = params.get('pid');
    const status = params.get('status');

    if (!PID) {
      app().innerHTML = `<div class="card">${t('invite_not_found')}</div>`;
      return;
    }

    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-invite-info`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
      body: JSON.stringify({ participantId: PID }),
    });
    const data = await res.json();

    if (data.error) {
      app().innerHTML = `<div class="card">${t('error_prefix')}: ${data.error}</div>`;
      return;
    }
    inviteInfo = data;

    const { data: { session } } = await client.auth.getSession();

    if (!session) {
      renderLoginStep();
      return;
    }

    const sessionEmail = session.user.email.toLowerCase();
    currentAccessToken = session.access_token;

    if (sessionEmail !== inviteInfo.email.toLowerCase()) {
      renderEmailMismatch(sessionEmail);
      return;
    }

    if (inviteInfo.needsRegistration) {
      renderRegistrationStep();
    } else if (status === 'ok') {
      window.location.href = `/projekti.html?id=${inviteInfo.projectId}`;
    } else {
      renderProjectStep(status);
    }
  }

  function renderLoginStep() {
    app().innerHTML = `
      <div class="card">
        <h1>${t('invite_heading')}</h1>
        <p class="sub">${t('invited_to_project', { projectName: '<strong>' + inviteInfo.projectName + '</strong>', email: inviteInfo.email })}</p>
        <button onclick="loginWithMicrosoft()">${t('login_microsoft_btn')}</button>
      </div>
    `;
  }

  function loginWithMicrosoft() {
    client.auth.signInWithOAuth({
      provider: 'azure',
      options: {
        scopes: 'email',
        redirectTo: window.location.origin + '/kutsu.html?pid=' + PID,
      },
    });
  }

  function renderEmailMismatch(sessionEmail) {
    app().innerHTML = `
      <div class="card">
        <h1>${t('wrong_account_heading')}</h1>
        <p class="sub">${t('wrong_account_body', { sessionEmail: '<strong>' + sessionEmail + '</strong>', inviteEmail: '<strong>' + inviteInfo.email + '</strong>' })}</p>
        <button onclick="logoutAndRetry()">${t('logout_and_retry_btn')}</button>
      </div>
    `;
  }

  async function logoutAndRetry() {
    await client.auth.signOut();
    window.location.reload();
  }

  function renderRegistrationStep() {
    const p = inviteInfo.prefill;
    app().innerHTML = `
      <div class="card">
        <h1>${t('complete_profile_heading')}</h1>
        <p class="sub">${t('project_label')}: <strong>${inviteInfo.projectName}</strong></p>

        <label>${t('first_name_label')}</label>
        <input type="text" id="regFirstName" value="${p.firstName}" />
        <label>${t('last_name_label')}</label>
        <input type="text" id="regLastName" value="${p.lastName}" />
        <label>${t('title_label')}</label>
        <input type="text" id="regTitle" value="${p.title}" />
        <label>${t('organization_label')}</label>
        <input type="text" id="regOrganization" value="${p.organization}" />

        <button onclick="saveProfile()">${t('save_and_continue_btn')}</button>
      </div>
    `;
  }

  async function saveProfile() {
    const body = {
      participantId: PID,
      firstName: document.getElementById('regFirstName').value,
      lastName: document.getElementById('regLastName').value,
      title: document.getElementById('regTitle').value,
      organization: document.getElementById('regOrganization').value,
    };

    const res = await fetch(`${SUPABASE_URL}/functions/v1/update-invite-profile`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (data.error) {
      AppDialog.alert(t('error_prefix') + ': ' + data.error);
      return;
    }

    renderProjectStep(null);
  }

    const GOOGLE_CLIENT_ID = "1023786751364-dbpmrjj0k1fggbfbb88r7p167o6bt84h.apps.googleusercontent.com";
  const GOOGLE_CALENDAR_REDIRECT_URI = "https://nrrhvbxvkizvkcwwglck.supabase.co/functions/v1/google-auth-callback";

  async function startCalendarAuth() {
    // Valtuutus siirtyy Microsoftiin/Googleen: tallennetaan näkyvyysrajaukset ensin,
    // muuten ne katoavat (sivu ladataan paluun jälkeen palvelimen tiedoista).
    if (settingsState) {
      const saved = await saveSettingsInline();
      if (!saved) return;
    }
    const { data: { session } } = await client.auth.getSession();
    const provider = session?.user?.app_metadata?.provider;

    if (provider === 'google') {
      const authUrl = new URL('https://accounts.google.com/o/oauth2/v2/auth');
      authUrl.searchParams.set('client_id', GOOGLE_CLIENT_ID);
      authUrl.searchParams.set('response_type', 'code');
      authUrl.searchParams.set('redirect_uri', GOOGLE_CALENDAR_REDIRECT_URI);
      authUrl.searchParams.set('scope', 'https://www.googleapis.com/auth/calendar.readonly');
      authUrl.searchParams.set('access_type', 'offline');
      authUrl.searchParams.set('prompt', 'consent');
      authUrl.searchParams.set('state', PID);
      window.location.href = authUrl.toString();
      return;
    }

    const authUrl = new URL('https://login.microsoftonline.com/common/oauth2/v2.0/authorize');
    authUrl.searchParams.set('client_id', CLIENT_ID);
    authUrl.searchParams.set('response_type', 'code');
    authUrl.searchParams.set('redirect_uri', CALENDAR_REDIRECT_URI);
    authUrl.searchParams.set('response_mode', 'query');
    authUrl.searchParams.set('scope', 'User.Read Calendars.Read offline_access');
    authUrl.searchParams.set('state', PID);
    window.location.href = authUrl.toString();
  }

  function statusBannerHtml(status) {
    if (!status) return '';
    if (status === 'ok') return `<div class="banner ok">${t('banner_auth_ok')}</div>`;
    if (status === 'denied') return `<div class="banner error">${t('banner_auth_denied')}</div>`;
    if (status === 'email_mismatch') return `<div class="banner error">${t('banner_email_mismatch')}</div>`;
    return `<div class="banner error">${t('banner_auth_error')}</div>`;
  }

  async function renderProjectStep(status) {
    window.history.replaceState({}, '', `/kutsu.html?pid=${PID}`);

    const calendarSectionHtml = inviteInfo.calendarAuthorized
      ? `<p class="checkmark">${t('calendar_authorized_check')}</p>`
      : `<button class="secondary" onclick="startCalendarAuth()">${t('grant_calendar_access')}</button>`;

    app().innerHTML = `
      <div class="card">
        <h1>${t('join_project_heading')}</h1>
        ${statusBannerHtml(status)}
        <p class="sub">${t('join_project_body', { projectName: '<strong>' + inviteInfo.projectName + '</strong>' })}</p>

        ${calendarSectionHtml}

        <div id="settingsArea">${t('loading')}</div>

        <button onclick="joinProject()">${t('join_project_btn')}</button>
      </div>
    `;

    await loadSettingsInline();
  }

  async function loadSettingsInline() {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/get-participant-settings`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ projectId: inviteInfo.projectId }),
    });
    const data = await res.json();

    if (data.error) {
      document.getElementById('settingsArea').innerHTML = `<p class="empty-note">${t('error_prefix')}: ${data.error}</p>`;
      return;
    }

    settingsState = {
      fullyHidden: !!data.fullyHidden,
      windowsByDay: { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] },
      blackouts: [],
    };

    (data.windows || []).forEach((w) => {
      settingsState.windowsByDay[w.weekday].push({ start: w.start_time.slice(0, 5), end: w.end_time.slice(0, 5) });
    });
    (data.blackouts || []).forEach((b) => {
      settingsState.blackouts.push({ startAt: b.start_at.slice(0, 16), endAt: b.end_at.slice(0, 16) });
    });

    renderSettingsInline();
  }

  function toggleSettingsDay(day, checked) {
    if (checked) {
      if (settingsState.windowsByDay[day].length === 0) settingsState.windowsByDay[day].push({ start: '09:00', end: '17:00' });
    } else {
      settingsState.windowsByDay[day] = [];
    }
    renderSettingsInline();
  }

  function addSettingsRange(day) {
    settingsState.windowsByDay[day].push({ start: '09:00', end: '17:00' });
    renderSettingsInline();
  }

  function removeSettingsRange(day, idx) {
    settingsState.windowsByDay[day].splice(idx, 1);
    renderSettingsInline();
  }

  function updateSettingsRangeField(day, idx, field, value) {
    settingsState.windowsByDay[day][idx][field] = value;
  }

  function addBlackout() {
    settingsState.blackouts.push({ startAt: '', endAt: '' });
    renderSettingsInline();
  }

  function removeBlackout(idx) {
    settingsState.blackouts.splice(idx, 1);
    renderSettingsInline();
  }

  function updateBlackoutField(idx, field, value) {
    settingsState.blackouts[idx][field] = value;
  }

  function renderSettingsInline() {
    const wdShort = weekdayShortArr();
    let daysHtml = '';
    for (let d = 0; d < 7; d++) {
      const ranges = settingsState.windowsByDay[d];
      const enabled = ranges.length > 0;
      const rangesHtml = ranges.map((r, idx) => `
        <div class="range-row">
          <input type="time" value="${r.start}" onchange="updateSettingsRangeField(${d}, ${idx}, 'start', this.value)" />
          <span>–</span>
          <input type="time" value="${r.end}" onchange="updateSettingsRangeField(${d}, ${idx}, 'end', this.value)" />
          <button type="button" class="remove-x" onclick="removeSettingsRange(${d}, ${idx})">✕</button>
        </div>
      `).join('');

      daysHtml += `
        <div class="day-block">
          <label class="day-toggle">
            <input type="checkbox" ${enabled ? 'checked' : ''} onchange="toggleSettingsDay(${d}, this.checked)" />
            ${wdShort[d]}
          </label>
          ${enabled ? `<div class="ranges">${rangesHtml}<button type="button" class="secondary add-range-btn" onclick="addSettingsRange(${d})">${t('add_time_range')}</button></div>` : ''}
        </div>
      `;
    }

    const blackoutsHtml = settingsState.blackouts.map((b, idx) => `
      <div class="blackout-row">
        <input type="datetime-local" value="${b.startAt}" onchange="updateBlackoutField(${idx}, 'startAt', this.value)" />
        <span>–</span>
        <input type="datetime-local" value="${b.endAt}" onchange="updateBlackoutField(${idx}, 'endAt', this.value)" />
        <button type="button" class="remove-x" onclick="removeBlackout(${idx})">✕</button>
      </div>
    `).join('') || `<p class="empty-note">${t('no_blackouts')}</p>`;

    document.getElementById('settingsArea').innerHTML = `
      <h3>${t('show_calendar_to_others')}</h3>
      <p class="empty-note">${t('show_calendar_note')}</p>
      ${daysHtml}

      <h3>${t('restrict_visibility_label')}</h3>
      <div id="blackoutsList">${blackoutsHtml}</div>
      <button type="button" class="secondary" onclick="addBlackout()">${t('add_new_btn')}</button>

      <label class="fully-hidden-row">
        <input type="checkbox" ${settingsState.fullyHidden ? 'checked' : ''} onchange="settingsState.fullyHidden = this.checked" />
        ${t('hide_calendar_fully')}
      </label>
    `;
  }

  async function saveSettingsInline() {
    const windows = [];
    for (let d = 0; d < 7; d++) {
      settingsState.windowsByDay[d].forEach((r) => {
        if (r.start && r.end) windows.push({ weekday: d, startTime: r.start + ':00', endTime: r.end + ':00' });
      });
    }
    const filledBlackouts = settingsState.blackouts.filter((b) => b.startAt && b.endAt);
    // datetime-local-arvot (YYYY-MM-DDTHH:MM) ovat merkkijonoina aikajärjestyksessä.
    if (filledBlackouts.some((b) => b.endAt <= b.startAt)) {
      AppDialog.alert(t('blackout_end_before_start'));
      return false;
    }
    const blackouts = filledBlackouts
      .map((b) => ({ startAt: b.startAt + ':00.000Z', endAt: b.endAt + ':00.000Z' }));

    await fetch(`${SUPABASE_URL}/functions/v1/update-participant-settings`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ projectId: inviteInfo.projectId, fullyHidden: settingsState.fullyHidden, windows, blackouts }),
    });
    return true;
  }

  async function joinProject() {
    if (settingsState) {
      const saved = await saveSettingsInline();
      if (!saved) return;
    }
    window.location.href = `/projekti.html?id=${inviteInfo.projectId}`;
  }

  init();
</script>

</body>
</html>
