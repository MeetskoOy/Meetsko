  function copyInviteField(fieldId) {
    const el = document.getElementById(fieldId);
    if (!el) return;
    el.select();
    const done = () => {
      const btn = document.getElementById(fieldId + 'Btn');
      if (!btn) return;
      const prev = btn.textContent;
      btn.textContent = t('copied_check');
      setTimeout(() => { btn.textContent = prev; }, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(el.value).then(done).catch(() => document.execCommand('copy') && done());
    } else {
      document.execCommand('copy');
      done();
    }
  }

    function localDateTimeString(date) {
    const p = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}` +
           `T${p(date.getHours())}:${p(date.getMinutes())}:00`;

  async function sendInvite() {
    const s = eventModalState;
    const btn = document.getElementById('sendInviteBtn');
    if (btn) { btn.disabled = true; btn.textContent = t('sending_label'); }

    const { required, optional } = buildInviteAttendees();
    const payload = {
      projectId: PROJECT_ID,
      requiredIds: required.map((a) => a.id),
      optionalIds: optional.map((a) => a.id),
      subject: s.inviteTitle,
      body: s.inviteBody || '',
      timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Europe/Helsinki',
      hidden: !!s.inviteHidden,
    };
    const isoOf = (ms) => new Date(ms).toISOString();

    if (isRecurringSeries() && s.rec.smart) {
      // Älykäs aikataulutus: erilliset kokoukset, koska kellonajat voivat vaihdella.
      payload.occurrences = s.occurrences.map((o) => ({
        start: localDateTimeString(new Date(o.startMs)),
        end: localDateTimeString(new Date(o.endMs)),
        startIso: isoOf(o.startMs),
        endIso: isoOf(o.endMs),
      }));
      payload.seriesInfo = { ...s.recRule, smart: true };
    } else {
      const slot = isRecurringSeries() ? s.occurrences[0] : selectedSlot();
      payload.start = localDateTimeString(new Date(slot.startMs));
      payload.end = localDateTimeString(new Date(slot.endMs));
      payload.startIso = isoOf(slot.startMs);
      payload.endIso = isoOf(slot.endMs);
      if (isRecurringSeries()) {
        payload.recurrence = {
          ...s.recRule,
          ...(s.rec.endType === 'count' ? { count: s.occurrences.length } : { endDate: s.rec.endDate }),
        };
        // Sarjan kerrat projektin tapahtumalistaa varten (Outlook luo samat kerrat säännöstä).
        payload.seriesOccurrences = s.occurrences.map((o) => ({ startIso: isoOf(o.startMs), endIso: isoOf(o.endMs) }));
      }
    }

    try {
      const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/create-event`, {
        method: 'POST',
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (data.error) {
        alert(t('invite_send_failed') + ': ' + data.error);
        if (btn) { btn.disabled = false; btn.textContent = t('send_invites_btn'); }
        return;
      }

      loadProjectEvents();
      // Julkaistu luonnos poistetaan luonnoslistalta.
      if (s.draftId) {
        await deleteDraftRequest(s.draftId);
        loadDrafts();
      }
      renderInviteSentStep(data);
    } catch (err) {
      alert(t('invite_send_failed') + ': ' + err.message);
      if (btn) { btn.disabled = false; btn.textContent = t('send_invites_btn'); }
    }
  }

async function openSettingsModal() {
    settingsActiveTab = 'own';

    // Pääkäyttäjä tai superadmin ilman osallistumista: vain projektin asetukset.
    if (!isParticipantInProject(latestStatus)) {
      if (!isAdminForProject(latestStatus)) return;
      settingsState = null;
      settingsActiveTab = 'project';
      renderSettingsModal();
      return;
    }

    const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/get-participant-settings`, {
      method: 'POST',
      body: JSON.stringify({ projectId: PROJECT_ID }),
    });
    const data = await res.json();

    if (data.error) {
      alert(t('error_prefix') + ': ' + data.error);
      return;
    }

    settingsState = {
      participantId: data.participantId,
        calendarStatus: data.calendarStatus,
      calendarWrite: !!data.calendarWrite,
      tokenUpdatedAt: data.tokenUpdatedAt,
      fullyHidden: !!data.fullyHidden,
      windowsByDay: { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] },
      blackouts: [],
    };

    (data.windows || []).forEach((w) => {
      settingsState.windowsByDay[w.weekday].push({ start: w.start_time.slice(0, 5), end: w.end_time.slice(0, 5) });
    });
    (data.blackouts || []).forEach((b) => {
      settingsState.blackouts.push({ startAt: isoToDatetimeLocal(b.start_at), endAt: isoToDatetimeLocal(b.end_at) });
    });

    renderSettingsModal();
  }

        <div class="radio-row">
          <label><input type="radio" name="dayRangeMode" value="full" ${dayRangeMode === 'full' ? 'checked' : ''} onchange="setDayRangeMode('full')" /> ${t('full_day_option')}</label>
          <label><input type="radio" name="dayRangeMode" value="business" ${dayRangeMode === 'business' ? 'checked' : ''} onchange="setDayRangeMode('business')" /> ${t('business_hours_option')}</label>
        </div>
        <div class="check-row">
          <input type="checkbox" id="hideWeekendsCheck" ${hideWeekends ? 'checked' : ''} onchange="setHideWeekends(this.checked)" />
          <label style="margin:0;" for="hideWeekendsCheck">${t('hide_weekends_label')}</label>
        </div>
      </div>
    `;
  }

  function calendarSectionHtml() {
    const s = settingsState;
    const locale = getCurrentLanguage() === 'en' ? 'en-GB' : 'fi-FI';
    if (s.calendarStatus === 'authorized') {
      const updated = s.tokenUpdatedAt ? new Date(s.tokenUpdatedAt).toLocaleString(locale) : '–';
      return `
        <div class="calendar-section">
          <p class="ok-text">${t('calendar_authorized_ok')}</p>
          <p class="meta">${t('last_updated_label')}: ${updated}</p>
          <button class="danger" type="button" onclick="revokeCalendarAuth()">${t('revoke_auth_btn')}</button>
        </div>
      `;
    }
    if (s.calendarStatus === 'expired') {
      return `
        <div class="calendar-section">
          <p class="warn-text">${t('calendar_expired_warn')}</p>
          <button type="button" onclick="startCalendarAuthForParticipant('${s.participantId}', ${s.calendarWrite})">${t('retry_auth_btn')}</button>
        </div>
      `;
    }
    return `
      <div class="calendar-section">
        <p class="empty-note">${t('calendar_not_authorized')}</p>
        <button type="button" onclick="startCalendarAuthForParticipant('${s.participantId}', ${s.calendarWrite})">${t('grant_calendar_access')}</button>
      </div>
    `;
  }

  async function revokeCalendarAuth() {
    if (!confirm(t('confirm_revoke_auth'))) return;

    const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/revoke-calendar-authorization`, {
      method: 'POST',
      body: JSON.stringify({ projectId: PROJECT_ID }),
    });
    const data = await res.json();
    if (data.error) { alert(t('error_prefix') + ': ' + data.error); return; }

    closeModal();
    loadStatus();
  }


    function writeAccessSectionHtml() {
    if (currentAuthProvider === 'google') return '';
    const s = settingsState;
    if (s.calendarWrite) {
      return `
        <div class="calendar-section" style="margin-top:18px;">
          <label style="margin-top:0; color:var(--text); font-weight:600;">${t('write_section_title')}</label>
          <p class="ok-text">${t('write_granted_ok')}</p>
        </div>
      `;
    }
    return `
      <div class="calendar-section" style="margin-top:18px;">
        <label style="margin-top:0; color:var(--text); font-weight:600;">${t('write_section_title')}</label>
        <p class="empty-note">${t('write_section_explain')}</p>
        <button type="button" onclick="startWriteAuth()">${t('grant_write_btn')}</button>
      </div>
    `;
  }

  function startWriteAuth() {
    if (!confirm(t('confirm_write_auth'))) return;
    startCalendarAuthForParticipant(settingsState.participantId, true);
  }

  async function leaveProjectConfirm() {
    if (!confirm(t('confirm_leave_project'))) return;

    const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/leave-project`, {
      method: 'POST',
      body: JSON.stringify({ projectId: PROJECT_ID }),
    });
    const data = await res.json();
    if (data.error) { alert(t('error_prefix') + ': ' + data.error); return; }

    window.location.href = '/projektit.html';
  }

  function toggleSettingsDay(day, checked) {
    if (checked) {
      if (settingsState.windowsByDay[day].length === 0) {
        settingsState.windowsByDay[day].push({ start: '09:00', end: '17:00' });
      }
    } else {
      settingsState.windowsByDay[day] = [];
    }
    renderSettingsModal();
  }

  function addSettingsRange(day) {
    settingsState.windowsByDay[day].push({ start: '09:00', end: '17:00' });
    renderSettingsModal();
  }

  function removeSettingsRange(day, idx) {
    settingsState.windowsByDay[day].splice(idx, 1);
    renderSettingsModal();
  }

  function updateSettingsRangeField(day, idx, field, value) {
    settingsState.windowsByDay[day][idx][field] = value;
  }

  function addBlackout() {
    settingsState.blackouts.push({ startAt: '', endAt: '' });
    renderSettingsModal();
  }

  function removeBlackout(idx) {
    settingsState.blackouts.splice(idx, 1);
    renderSettingsModal();
  }

  function updateBlackoutField(idx, field, value) {
    settingsState.blackouts[idx][field] = value;
  }

   function switchSettingsTab(tab) {
    settingsActiveTab = tab;
    renderSettingsModal();
  }

  function renderSettingsModal() {
    const admin = isAdminForProject(latestStatus);

    const participant = isParticipantInProject(latestStatus);
    const tabsHtml = admin && participant ? `
      <div class="settings-tabs">
        <button type="button" class="settings-tab-btn ${settingsActiveTab === 'own' ? 'active' : ''}" onclick="switchSettingsTab('own')">${t('settings_tab_own')}</button>
        <button type="button" class="settings-tab-btn ${settingsActiveTab === 'project' ? 'active' : ''}" onclick="switchSettingsTab('project')">${t('settings_tab_project')}</button>
      </div>
    ` : '';

    const bodyHtml = participant && (!admin || settingsActiveTab === 'own') ? renderOwnSettingsTabHtml() : renderProjectSettingsTabHtml();

    document.getElementById('modalHost').innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal settings-modal">
          <h3>${t('modal_settings')}</h3>
          ${tabsHtml}
          ${bodyHtml}
          <div class="actions">
            <button class="secondary" onclick="closeModal()">${t('close')}</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderOwnSettingsTabHtml() {
    let daysHtml = '';
    const wdShort = weekdayShortArr();
    for (let d = 0; d < 7; d++) {
      const ranges = settingsState.windowsByDay[d];
      const enabled = ranges.length > 0;
      const rangesHtml = ranges.map((r, idx) => `
        <div class="range-row">
          <input type="time" value="${r.start}" onchange="updateSettingsRangeField(${d}, ${idx}, 'start', this.value)" />
          <span>–</span>
          <input type="time" value="${r.end}" onchange="updateSettingsRangeField(${d}, ${idx}, 'end', this.value)" />
          <button type="button" class="remove-x" onclick="removeSettingsRange(${d}, ${idx})">✕</button>
        </div>
      `).join('');

      daysHtml += `
        <div class="day-block">
          <label class="day-toggle">
            <input type="checkbox" ${enabled ? 'checked' : ''} onchange="toggleSettingsDay(${d}, this.checked)" />
            ${wdShort[d]}
          </label>
          ${enabled ? `<div class="ranges">${rangesHtml}<button type="button" class="secondary add-range-btn" onclick="addSettingsRange(${d})">${t('add_time_range')}</button></div>` : ''}
        </div>
      `;
    }

    const blackoutsHtml = settingsState.blackouts.map((b, idx) => `
      <div class="blackout-row">
        <input type="datetime-local" value="${b.startAt}" onchange="updateBlackoutField(${idx}, 'startAt', this.value)" />
        <span>–</span>
        <input type="datetime-local" value="${b.endAt}" onchange="updateBlackoutField(${idx}, 'endAt', this.value)" />
        <button type="button" class="remove-x" onclick="removeBlackout(${idx})">✕</button>
      </div>
    `).join('') || `<p class="empty-note">${t('no_blackouts')}</p>`;

    return `
      ${viewPrefsSectionHtml()}
      ${calendarSectionHtml()}
      ${writeAccessSectionHtml()}

      <label style="margin-top:0;">${t('show_calendar_to_others')}</label>
      <p class="empty-note" style="margin-top:-2px;">${t('show_calendar_note')}</p>
      ${daysHtml}

      <label style="margin-top:16px;">${t('restrict_visibility_label')}</label>
      <div id="blackoutsList">${blackoutsHtml}</div>
      <button type="button" class="secondary" onclick="addBlackout()">${t('add_new_btn')}</button>

      <label class="fully-hidden-row">
        <input type="checkbox" ${settingsState.fullyHidden ? 'checked' : ''} onchange="settingsState.fullyHidden = this.checked" />
        ${t('hide_calendar_fully')}
      </label>

      <div class="actions">
        <button onclick="saveSettingsSubmit()">${t('save_btn')}</button>
      </div>

      <div class="danger-zone">
        <button class="danger" type="button" onclick="leaveProjectConfirm()">${t('leave_project_btn')}</button>
      </div>
    `;
  }

  function renderProjectSettingsTabHtml() {
    const membersHtml = latestStatus.participants.map((p) => `
      <div class="member-manage-row">
        <span class="mm-name">${nameLabelFor(p)}</span>
        <select onchange="changeParticipantRole('${p.id}', this.value)">
          <option value="guest" ${p.role === 'guest' ? 'selected' : ''}>${t('role_guest')}</option>
          <option value="admin" ${p.role === 'admin' ? 'selected' : ''}>${t('role_admin')}</option>
        </select>
        <button type="button" class="danger" style="padding:5px 10px; font-size:12px;" onclick="removeParticipantFromProject('${p.id}','${nameLabelFor(p).replace(/'/g, "\\'")}')">${t('remove_participant_btn')}</button>
      </div>
    `).join('');

    return `
      <label style="margin-top:0;">${t('project_name_label')}</label>
      <input type="text" id="projectNameEditInput" value="${latestStatus.project.name}" />
      <div class="actions" style="margin-top:8px;">
        <button onclick="saveProjectName()">${t('save_btn')}</button>
      </div>

      <label style="margin-top:20px;">${t('manage_members_heading')}</label>
      <div>${membersHtml}</div>
      ${canOwnProject(latestStatus) ? ownerAndDeleteSectionHtml() : ''}
    `;
  }

  function ownerAndDeleteSectionHtml() {
    const currentOwner = latestStatus.project.owner_email.toLowerCase();
    const ownerIsParticipant = latestStatus.participants.some((p) => p.email.toLowerCase() === currentOwner);
    const options = (ownerIsParticipant ? [] : [`<option value="" selected>${escapeHtmlText(latestStatus.project.owner_email)}</option>`])
      .concat(latestStatus.participants.map((p) => `
        <option value="${escapeHtmlText(p.email)}" ${p.email.toLowerCase() === currentOwner ? 'selected' : ''}>${escapeHtmlText(nameLabelFor(p))} (${escapeHtmlText(p.email)})</option>
      `)).join('');
    return `
      <label style="margin-top:20px;">${t('owner_change_label')}</label>
      <p class="empty-note" style="margin-top:-2px;">${t('owner_change_note')}</p>
      <select id="projectOwnerSelect" style="width:100%;">${options}</select>
      <div class="actions" style="margin-top:8px;">
        <button onclick="saveProjectOwner()">${t('owner_change_btn')}</button>
      </div>

      <div class="danger-zone">
        <p class="empty-note" style="margin-top:0;">${t('delete_project_note')}</p>
        <button class="danger" type="button" onclick="deleteProjectConfirm()">${t('delete_project_btn')}</button>
      </div>
    `;
  }

  async function saveProjectOwner() {
    const ownerEmail = document.getElementById('projectOwnerSelect').value;
    if (!ownerEmail || ownerEmail.toLowerCase() === latestStatus.project.owner_email.toLowerCase()) return;
    if (!confirm(t('confirm_owner_change', { email: ownerEmail }))) return;

    const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/update-project`, {
      method: 'POST',
      body: JSON.stringify({ projectId: PROJECT_ID, ownerEmail }),
    });
    const data = await res.json();
    if (data.error) { alert(t('error_prefix') + ': ' + data.error); return; }

    await loadStatus();
    renderSettingsModal();
  }

  async function deleteProjectConfirm() {
    const name = latestStatus.project.name;
    if (!confirm(t('confirm_delete_project_1', { name }))) return;
    if (!confirm(t('confirm_delete_project_2', { name }))) return;

    const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/delete-project`, {
      method: 'POST',
      body: JSON.stringify({ projectId: PROJECT_ID }),
    });
    const data = await res.json();
    if (data.error) { alert(t('error_prefix') + ': ' + data.error); return; }

    window.location.href = '/projektit.html';
  }

  async function saveProjectName() {
    const name = document.getElementById('projectNameEditInput').value.trim();
    if (!name) return;

    const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/update-project`, {
      method: 'POST',
      body: JSON.stringify({ projectId: PROJECT_ID, name }),
    });
    const data = await res.json();
    if (data.error) { alert(t('error_prefix') + ': ' + data.error); return; }

    await loadStatus();
    alert(t('project_name_saved'));
  }

  async function changeParticipantRole(participantId, role) {
    const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/update-participant-role`, {
      method: 'POST',
      body: JSON.stringify({ projectId: PROJECT_ID, participantId, role }),
    });
    const data = await res.json();
    if (data.error) { alert(t('error_prefix') + ': ' + data.error); }

    await loadStatus();
    renderSettingsModal();
  }

  async function removeParticipantFromProject(participantId, name) {
    if (!confirm(t('confirm_remove_participant', { name }))) return;

    const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/remove-participant-from-project`, {
      method: 'POST',
      body: JSON.stringify({ projectId: PROJECT_ID, participantId }),
    });
    const data = await res.json();
    if (data.error) { alert(t('error_prefix') + ': ' + data.error); return; }

    await loadStatus();
    renderSettingsModal();
  }

    

  async function saveSettingsSubmit() {
    const windows = [];
    for (let d = 0; d < 7; d++) {
      settingsState.windowsByDay[d].forEach((r) => {
        if (r.start && r.end) windows.push({ weekday: d, startTime: r.start + ':00', endTime: r.end + ':00' });
      });
    }

    const filledBlackouts = settingsState.blackouts.filter((b) => b.startAt && b.endAt);
    // datetime-local-arvot (YYYY-MM-DDTHH:MM) ovat merkkijonoina aikajärjestyksessä.
    if (filledBlackouts.some((b) => b.endAt <= b.startAt)) {
      alert(t('blackout_end_before_start'));
      return;
    }
    const blackouts = filledBlackouts
      .map((b) => ({ startAt: datetimeLocalToIso(b.startAt), endAt: datetimeLocalToIso(b.endAt) }));

    const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/update-participant-settings`, {
      method: 'POST',
      body: JSON.stringify({
        projectId: PROJECT_ID,
        fullyHidden: settingsState.fullyHidden,
        windows,
        blackouts,
      }),
    });
    const data = await res.json();

    if (data.error) {
      alert(t('error_prefix') + ': ' + data.error);
      return;
    }

    closeModal();
    loadStatus();
  }

  attachMasterPaging();

  // Otsikko seuraa vieritystä: näytetään päivä, joka on näkymän keskellä.
  document.getElementById('mainTimelineCol').addEventListener('scroll', () => {
    positionDayLabels();
    if (anchorDateStr) updateDateTitle(visibleDateStr());
  });

  // Ikkunan koon muuttuessa päivän leveys sovitetaan uudelleen.
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const keepDate = anchorDateStr ? visibleDateStr() : null;
      computeHoursWindow();
      if (keepDate) anchorDateStr = keepDate;
      renderAll();
      setHomeScroll();
    }, 150);
  });

  // Työkaluvihje elementeille, joilla on data-tip.
  (function attachTooltips() {
    const box = document.getElementById('tipBox');
    document.addEventListener('mouseover', (e) => {
      const el = e.target.closest('[data-tip]');
      if (!el) { box.style.display = 'none'; return; }
      box.textContent = el.getAttribute('data-tip');
      box.style.display = 'block';
    });
    document.addEventListener('mousemove', (e) => {
      if (box.style.display !== 'block') return;
      const el = e.target.closest('[data-tip]');
      if (!el) { box.style.display = 'none'; return; }
      const rect = el.getBoundingClientRect();
      box.style.left = e.clientX + 'px';
      box.style.top = (rect.top - 6) + 'px';
    });
  })();

  setInterval(renderNowOverlay, 60000);

  // Kalenterit päivittyvät palvelimella automaattisesti muutosilmoitusten
  // perusteella (calendar-webhook + calendar-sync). Sivu lukee tuoreen tilan
  // tietokannasta — ei Graph-kutsuja — 2 min välein ja välilehdelle palatessa.
  const STATUS_POLL_MS = 2 * 60 * 1000;
  let statusPollInFlight = false;
  async function pollStatus() {
    if (statusPollInFlight || document.hidden || !latestStatus) return;
    statusPollInFlight = true;
    try { await loadStatus(); } finally { statusPollInFlight = false; }
  }
  setInterval(pollStatus, STATUS_POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pollStatus(); });
  computeHoursWindow();
  updateDayRangeSegment();

  (async () => {
    const ok = await ensureLoggedIn();
    if (ok) {
      await loadMyProfileAndTranslations();
      await loadStatus();
      setHomeScroll();
      showAuthReturnBanner();
    }
  })();
</script>

</body>
</html>
