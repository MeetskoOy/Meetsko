<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meetsko — Projektin hallinta</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='36' height='36' rx='8' fill='%231B3A6B'/%3E%3Crect x='24' y='24' width='36' height='36' rx='8' fill='%238FB3E8'/%3E%3Cpath d='M24 32A8 8 0 0 1 32 24H40V32A8 8 0 0 1 32 40H24Z' fill='%232BB39A'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/app.css" />
<style>
  p.sub { color: var(--text-muted); font-size: 14px; margin-top: 0; }
  #inviteResult { margin: 0 0 12px; font-size: 13px; word-break: break-all; }
  #inviteResult:empty { display: none; }

  /* Sivun otsikko */
  .project-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; margin: 12px 0 20px; flex-wrap: wrap; }
  .project-head .head-actions { margin-top: 4px; }

  /* Päävälilehdet (Aikataulu / Projektin tapahtumat) ja alivälilehdet */
  .page-tabs { display: flex; gap: 24px; margin-top: 18px; }
  .page-tab { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-muted); padding: 6px 0 8px; margin: 0; border-radius: 0; font-size: 14.5px; font-weight: 600; }
  .page-tab:hover { background: none; border-color: transparent; color: var(--text); }
  .page-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .events-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .sub-tabs { display: flex; gap: 6px; padding: 12px 24px; border-bottom: 1px solid var(--line); }
  .sub-tab { background: none; border: 1px solid transparent; color: var(--text-muted); padding: 7px 12px; margin: 0; font-size: 13.5px; font-weight: 500; border-radius: 8px; }
  .sub-tab:hover { background: var(--surface-muted); border-color: transparent; color: var(--text); }
  .sub-tab.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .sub-tab .count { color: var(--text-faint); font-weight: 400; margin-left: 4px; }
  .events-panel-body { padding: 8px 24px 20px; }
  .panel-note { color: var(--text-faint); font-size: 13.5px; padding: 18px 0; margin: 0; }

  /* Luonnoslista */
  .draft-row { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-top: 1px solid var(--line-soft); }
  .draft-row:first-child { border-top: none; }
  .draft-row .dr-main { flex: 1; min-width: 0; }
  .draft-row .dr-title { font-size: 15px; font-weight: 600; }
  .draft-row .dr-time { font-size: 13px; color: var(--text-muted); margin-top: 3px; font-family: var(--mono); }
  .draft-row .dr-flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .draft-row .dr-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .draft-row .dr-actions button { margin: 0; padding: 7px 12px; font-size: 13px; }
  .draft-row.past .dr-title, .draft-row.past .dr-time { color: var(--danger); }
  .draft-row { flex-wrap: wrap; }
  .draft-row .dr-title-btn { background: none; border: none; padding: 0; margin: 0; color: inherit; font: inherit; font-size: 15px; font-weight: 700; text-align: left; cursor: pointer; }
  .draft-row .dr-title-btn:hover { background: none; border: none; text-decoration: underline; }
  .draft-details { flex-basis: 100%; background: var(--surface-muted); border: 1px solid var(--line-soft); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: 160px 1fr; gap: 10px 16px; font-size: 13.5px; }
  .draft-details .dd-label { color: var(--text-muted); font-weight: 600; }
  .draft-details .dd-times { display: flex; flex-direction: column; gap: 2px; max-height: 160px; overflow-y: auto; }
  .draft-details .dd-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .draft-details .dd-chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; }
  .draft-details .dd-chip.optional { border-style: dashed; }
  .draft-details .dd-body { white-space: pre-wrap; }
  .draft-details .dd-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; }
  .draft-details .dd-actions button { margin: 0; padding: 6px 12px; font-size: 13px; }
  /* Tapahtumalista: päivät ryhminä, rivit vieritettävissä sivusuunnassa */
  .ev-scroll { overflow-x: auto; margin: 0 -24px; padding: 0 24px; }
  .ev-list { display: inline-block; min-width: 100%; }
  .ev-day { font-size: 13px; font-weight: 800; color: var(--text); padding: 18px 0 8px; position: sticky; left: 0; }
  .ev-row { display: flex; align-items: center; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line-soft); white-space: nowrap; }
  .ev-day + .ev-row { border-top: none; }
  .ev-main { position: sticky; left: 0; z-index: 1; background: var(--surface); display: flex; align-items: center; gap: 10px; width: 360px; flex: 0 0 360px; padding-right: 8px; box-sizing: border-box; }
  .ev-time { font-size: 13px; color: var(--text-muted); width: 92px; flex: 0 0 92px; }
  .ev-name { background: none; border: none; padding: 0; margin: 0; color: var(--text); font: inherit; font-size: 14.5px; font-weight: 700; cursor: pointer; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  .ev-name:hover { background: none; border: none; text-decoration: underline; }
  .ev-icon { display: inline-flex; color: var(--text-faint); flex: none; }
  .ev-icon svg { width: 14px; height: 14px; }
  .ev-pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #EEF1F4; color: var(--text-muted); flex: none; }
  .ev-pill.cancel { background: var(--danger-soft); color: #9C2C22; }
  .ev-attendees { display: flex; gap: 6px; align-items: center; }
  .ev-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
  .ev-chip.optional { border-style: dashed; color: var(--text-muted); }
  .ev-chip.organizer { border-color: var(--primary); background: var(--primary-soft); }
  .ev-chip .org-mark { font-size: 10.5px; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 0.04em; }
  .ev-row.cancelled .ev-name, .ev-row.cancelled .ev-time { text-decoration: line-through; color: var(--text-faint); }
  .ev-past .ev-day, .ev-past .ev-name, .ev-past .ev-time, .ev-past .ev-chip { color: var(--text-faint); }
  .ev-past .ev-chip.organizer { background: var(--surface-muted); border-color: var(--line); }
  .ev-details { position: sticky; left: 0; width: min(100%, 760px); margin: 0 0 12px; white-space: normal; background: var(--surface-muted); border: 1px solid var(--line-soft); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: 160px 1fr; gap: 10px 16px; font-size: 13.5px; box-sizing: border-box; }
  .ev-details .dd-label { color: var(--text-muted); font-weight: 600; }
  .ev-details .dd-body { white-space: pre-wrap; }
  .ev-details a { color: var(--primary); word-break: break-all; }
  .ev-details .dd-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 8px; }
  .ev-details .dd-actions button { margin: 0; padding: 6px 12px; font-size: 13px; }
  .past-link { background: none; border: none; padding: 0; margin: 18px 0 4px; color: var(--text-faint); font-size: 13.5px; font-weight: 600; text-decoration: underline; cursor: pointer; }
  .past-link:hover { background: none; border: none; color: var(--text-muted); }
  /* Ajanvalitsin (päivämäärä + kellonaika samassa näkymässä) */
  .dt-field { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; background: var(--surface); color: var(--text); border: 1px solid #D0D5DD; border-radius: 8px; padding: 9px 11px; margin: 0; font: inherit; font-size: 14px; font-weight: 500; text-align: left; cursor: pointer; box-sizing: border-box; }
  .dt-field:hover { background: var(--surface-muted); border-color: #D0D5DD; }
  .dt-field.empty { color: var(--text-faint); }
  .dt-field svg { width: 16px; height: 16px; color: var(--text-faint); flex: none; }
  .dt-range-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dt-range-grid label { margin-top: 10px; }
  .dtp-pop { position: fixed; z-index: 60; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 36px rgba(14,34,64,0.18); padding: 14px; display: flex; flex-direction: column; gap: 12px; font-size: 13.5px; }
  .dtp-ends { display: flex; gap: 8px; }
  .dtp-end-btn { flex: 1; background: var(--surface-muted); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; margin: 0; font: inherit; font-size: 12.5px; text-align: left; cursor: pointer; }
  .dtp-end-btn:hover { background: var(--surface-muted); border-color: var(--primary); }
  .dtp-end-btn.active { border-color: var(--primary); background: var(--primary-soft); }
  .dtp-end-btn b { display: block; font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .dtp-body { display: flex; gap: 14px; }
  .dtp-cal { width: 252px; }
  .dtp-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-weight: 700; }
  .dtp-cal-head button { background: none; border: 1px solid var(--line); color: var(--text); width: 28px; height: 28px; padding: 0; margin: 0; border-radius: 6px; }
  .dtp-cal-head button:hover { background: var(--surface-muted); border-color: var(--line); }
  .dtp-grid { display: grid; grid-template-columns: repeat(7, 36px); gap: 0; }
  .dtp-wd { font-size: 11px; color: var(--text-faint); text-align: center; padding: 4px 0; font-weight: 600; }
  .dtp-day { height: 32px; background: none; border: none; margin: 0; padding: 0; color: var(--text); font: inherit; font-size: 13px; border-radius: 6px; cursor: pointer; }
  .dtp-day:hover { background: var(--surface-muted); border: none; }
  .dtp-day.other { color: var(--text-faint); }
  .dtp-day.today { font-weight: 800; }
  .dtp-day.in-range { background: var(--primary-soft); border-radius: 0; }
  .dtp-day.sel, .dtp-day.sel:hover { background: var(--primary); color: #fff; border-radius: 6px; }
  .dtp-times { width: 92px; display: flex; flex-direction: column; gap: 6px; }
  .dtp-times input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #D0D5DD; border-radius: 6px; font: inherit; font-size: 13px; }
  .dtp-time-list { position: relative; height: 230px; overflow-y: auto; border: 1px solid var(--line-soft); border-radius: 8px; }
  .dtp-time { display: block; width: 100%; background: none; border: none; margin: 0; padding: 6px 10px; text-align: left; font: inherit; font-size: 13px; color: var(--text); border-radius: 0; cursor: pointer; }
  .dtp-time:hover { background: var(--surface-muted); border: none; }
  .dtp-time.sel, .dtp-time.sel:hover { background: var(--primary); color: #fff; }
  .dtp-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .dtp-foot button { margin: 0; padding: 6px 12px; font-size: 13px; }
  .dtp-error { color: var(--danger); font-size: 12px; }
  .draft-flag { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--line-soft); color: var(--text-muted); }
  .draft-flag.warn { background: var(--danger-soft); color: #9C2C22; }
  .draft-flag.info { background: #FBF0D9; color: #91600C; }
  .modal .draft-edit-note { font-size: 12.5px; color: #91600C; background: #FBF0D9; border-radius: 8px; padding: 8px 10px; margin: 0 0 12px; }
  .title-row { display: flex; align-items: center; gap: 14px; }
  .project-meta { margin: 8px 0 0; font-size: 14px; color: var(--text-muted); display: flex; gap: 20px; flex-wrap: wrap; }

  /* Kalenterikortti */
  .board { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .board-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .bt-left, .bt-right { display: flex; align-items: center; gap: 10px; position: relative; }
  .icon-btn { width: 40px; height: 40px; padding: 0; margin: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--surface); color: var(--text); border: 1px solid #D0D5DD; border-radius: 8px; }
  .icon-btn:hover { background: var(--surface-muted); border-color: #D0D5DD; }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn.spinning svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .date-title { background: none; border: none; color: var(--text); font-size: 17px; font-weight: 600; padding: 4px 6px; margin: 0 0 0 6px; border-radius: 6px; }
  .date-title:hover { background: var(--surface-muted); }
  .date-picker-input { position: absolute; left: 100px; top: 100%; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; pointer-events: none; }
  .small-btn { padding: 8px 14px; font-size: 13px; margin: 0; }
  .fetched { font-family: var(--mono); font-size: 12.5px; color: var(--text-muted); }
  .seg { display: inline-flex; background: #EEF0F3; border-radius: 8px; padding: 3px; }
  .seg button { background: none; border: none; color: var(--text-muted); padding: 7px 12px; margin: 0; font-size: 13px; font-weight: 500; border-radius: 6px; }
  .seg button:hover { background: none; color: var(--text); }
  .seg button.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(15,27,45,0.12); }

  .dual-pane { display: flex; padding-right: 24px; }
  .names-col { width: 264px; flex: 0 0 264px; }
  .timeline-col { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; }
  #mainTimelineCol { scrollbar-width: thin; scrollbar-color: #C9CFD7 transparent; }
  #mainTimelineCol::-webkit-scrollbar { height: 8px; }
  #mainTimelineCol::-webkit-scrollbar-thumb { background: #C9CFD7; border-radius: 4px; }
  .timeline-inner { position: relative; }

  .ruler-cell { height: 40px; position: relative; border-bottom: 1px solid var(--line); box-sizing: border-box; }
  .ruler-spacer { height: 40px; border-bottom: 1px solid var(--line); box-sizing: border-box; }
  .day-label { position: absolute; top: 0; height: 16px; font-size: 10px; color: var(--text-faint); border-left: 1px solid var(--line); padding-left: 4px; box-sizing: border-box; }
  .hour-label { position: absolute; top: 17px; font-family: var(--mono); font-size: 12px; color: var(--text-muted); padding-left: 2px; }
  .event-mini-board .hour-label { font-size: 10px; }

  /* Pääaikajanan otsikkorivi: navigointi vasemmalla, päivämäärä ja tunnit oikealla */
  .ruler-head { height: 56px; display: flex; align-items: center; gap: 8px; padding-left: 24px; border-bottom: 1px solid var(--line); box-sizing: border-box; }
  .ruler-head .icon-btn { width: 32px; height: 32px; }
  .ruler-head .icon-btn svg { width: 14px; height: 14px; }
  .ruler-head .small-btn { padding: 6px 12px; }
  #mainRuler { height: 56px; }
  #mainRuler .hour-label { top: 32px; }
  .sticky-day-label { position: absolute; top: 8px; font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; padding-left: 2px; background: var(--surface); z-index: 2; }
  .ruler-day-divider { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }

  .hour-grid-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-soft); z-index: 1; }

  .section-header-row { display: flex; align-items: center; gap: 8px; height: 44px; cursor: pointer; user-select: none; padding-left: 24px; }
  .section-header-row .chevron { display: inline-flex; color: var(--text-muted); transition: transform 0.15s; }
  .section-header-row .chevron.open { transform: rotate(90deg); }
  .section-header-row .title { font-weight: 600; font-size: 13px; }
  .section-header-row .count { color: var(--text-faint); font-size: 13px; }
  .section-spacer-row { height: 44px; border-top: 1px solid var(--line-soft); }
  .names-col .section-header-row { border-top: 1px solid var(--line-soft); }
  .names-col .ruler-head + .whole-row + .section-header-row { border-top: none; }
  .timeline-row.whole-row + .section-spacer-row { border-top: none; }

  .name-row, .timeline-row { height: 53px; display: flex; align-items: center; box-sizing: border-box; }
  .name-row + .name-row, .timeline-row + .timeline-row { border-top: 1px solid var(--line-soft); }
  .name-row { gap: 12px; padding: 0 6px 0 24px; }
  .name-row.clickable { cursor: pointer; }
  .whole-row { height: 61px; background: var(--surface-muted); border-bottom: 1px solid var(--line); }
  .event-mini-board .name-row, .event-mini-board .timeline-row { height: 44px; }
  .event-mini-board .name-row { padding-left: 0; }

  .avatar { width: 32px; height: 32px; border-radius: 50%; flex: 0 0 32px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600; box-sizing: border-box; }
  .avatar.group-icon { border-radius: 8px; background: var(--primary-soft); color: var(--primary); }
  .avatar.group-icon svg { width: 16px; height: 16px; }
  .avatar.status-circle { background: #fff; border: 2px solid; }
  .avatar.status-circle.ok { border-color: var(--ok); color: var(--ok); }
  .avatar.status-circle.warn { border-color: var(--warn); border-style: dashed; color: var(--warn); }

  .who-text { display: flex; flex-direction: column; min-width: 0; }
  .who-text .name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .whole-row .who-text .name { font-weight: 600; }
  .who-text .name.clickable { cursor: pointer; }
  .who-text .name.clickable:hover { text-decoration: underline; }
  .who-text .status-line { font-size: 12px; margin-top: 1px; }
  .status-line.group { color: var(--primary); }
  .status-line.warn { color: var(--warn); }

  .timeline-row { position: relative; }
  .timeline-row.clickable { cursor: pointer; }
  .timeline-cell { position: relative; height: 26px; }
  .whole-row .timeline-cell { height: 34px; }
  .day-bg { position: absolute; top: 0; bottom: 0; background: var(--line-soft); border-radius: 6px; border: 1px solid var(--line); box-sizing: border-box; z-index: 0; }
  .board .day-bg { background: none; border: none; border-left: 1px solid var(--line); border-radius: 0; }
  .busy-block { position: absolute; top: 0; bottom: 0; background: var(--busy); border-radius: 3px; z-index: 2; }
  .someone-busy-block { position: absolute; top: 0; bottom: 0; background: var(--busy-strong); border-radius: 3px; z-index: 2; }
  .all-free-block { position: absolute; top: 0; bottom: 0; background: var(--free-bg); border: 1px solid var(--free-line); border-radius: 3px; box-sizing: border-box; z-index: 2; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--free-text); overflow: hidden; white-space: nowrap; }
  .restricted-block { position: absolute; top: 0; bottom: 0; background: #4C6FA5; border-radius: 3px; z-index: 0; opacity: 0.55; }

  /* Projektin tapahtumat ja omat luonnokset aikajanalla (lohkossa nimi) */
  .ov-layer { position: absolute; left: 0; top: 50%; height: 26px; transform: translateY(-50%); z-index: 3; pointer-events: none; }
  .ov-block { position: absolute; top: 0; bottom: 0; box-sizing: border-box; border-radius: 4px; padding: 0 6px; display: flex; align-items: center; font-size: 11.5px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: auto; cursor: pointer; }
  .ov-block span { overflow: hidden; text-overflow: ellipsis; }
  .ov-event { background: #FBE9E6; border: 1px solid var(--busy); }
  .ov-draft { background: #FDF3C4; border: 1px solid #E2B93B; z-index: 1; }
  .legend .swatch.ov-event { background: #FBE9E6; border: 1px solid var(--busy); }
  .legend .swatch.ov-draft { background: #FDF3C4; border: 1px solid #E2B93B; }
  .no-auth-band { position: absolute; top: 13px; bottom: 13px; border-radius: 4px; display: flex; align-items: center; padding-left: 12px; font-size: 12.5px; color: var(--text-muted);
    background: repeating-linear-gradient(135deg, #F1F3F6 0 8px, #E6E9EE 8px 16px); }
  .no-auth-band.plain { background: var(--surface-muted); }

  .now-line { position: absolute; top: -20px; bottom: 0; width: 2px; background: var(--primary); z-index: 3; }
  #timelineCol .now-line { display: none; }
  .now-marker { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--primary); z-index: 5; pointer-events: none; }
  .now-badge { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #fff; font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
  .no-data { color: var(--text-faint); font-size: 12.5px; }

  // Tunnin leveys sovitetaan niin, että yksi päivä täyttää aikajanan näkyvän
  // leveyden (ks. computeHoursWindow). 80 px on alkuarvo ennen mittausta.
  let HOUR_PX = 80;
  let PX_PER_MIN = HOUR_PX / 60;
  const MIN_HOUR_PX = 40;
  const BUFFER_DAYS = 5;

  function weekdayShortArr() {
    return ['weekday_short_mon','weekday_short_tue','weekday_short_wed','weekday_short_thu','weekday_short_fri','weekday_short_sat','weekday_short_sun'].map((k) => t(k));
  }
  function weekdayFullArr() {
    return ['weekday_full_mon','weekday_full_tue','weekday_full_wed','weekday_full_thu','weekday_full_fri','weekday_full_sat','weekday_full_sun'].map((k) => t(k));
  }
  function monthFullArr() {
    const arr = [];
    for (let i = 1; i <= 12; i++) arr.push(t('month_' + i));
    return arr;
  }

  const CLIENT_ID = "54f922c6-aa24-44b4-9305-f28964c09f96";

  let dayRangeMode = 'full';
  let hideWeekends = false;

  let HOURS_START = 0;
  let HOURS_END = 24;
  let DAY_VISIBLE_PX = 24 * HOUR_PX;

  function computeHoursWindow() {
    if (dayRangeMode === 'business') { HOURS_START = 8; HOURS_END = 18; }
    else { HOURS_START = 0; HOURS_END = 24; }
    const col = document.getElementById('mainTimelineCol');
    const visibleWidth = col ? col.clientWidth : 0;
    if (visibleWidth > 0) {
      HOUR_PX = Math.max(MIN_HOUR_PX, visibleWidth / (HOURS_END - HOURS_START));
      PX_PER_MIN = HOUR_PX / 60;
    }
    DAY_VISIBLE_PX = (HOURS_END - HOURS_START) * HOUR_PX;
  }

  function updateDayRangeSegment() {
    document.getElementById('segBusiness').classList.toggle('active', dayRangeMode === 'business');

  }

    const viewPrefs = JSON.parse(localStorage.getItem('yhteisikkuna_viewPrefs') || '{}');
    dayRangeMode = viewPrefs.dayRangeMode || 'full';
    hideWeekends = !!viewPrefs.hideWeekends;
    computeHoursWindow();
  }
  loadViewPrefsFromStorage();

  function saveViewPrefs() {
    localStorage.setItem('yhteisikkuna_viewPrefs', JSON.stringify({ dayRangeMode, hideWeekends }));

  function toDateStr(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function todayDateStr() {
    return toDateStr(new Date());
  }

  function stepDay(dateStr, direction) {
    const d = new Date(dateStr + 'T00:00:00');
    do {
      d.setDate(d.getDate() + direction);
    } while (hideWeekends && (d.getDay() === 0 || d.getDay() === 6));
    return toDateStr(d);
  }

  function stepDayBy(dateStr, n) {
    let c = dateStr;
    const dir = n >= 0 ? 1 : -1;
    for (let i = 0; i < Math.abs(n); i++) c = stepDay(c, dir);
    return c;
  }
function bufferDates(anchor) {
    anchor = anchor || anchorDateStr;
    const prev = stepDay(anchor, -1);
    const arr = [prev, anchor];
    let c = anchor;
    for (let i = 0; i < 3; i++) {
      c = stepDay(c, 1);
      arr.push(c);
    }
    return arr;
  }

  function itemDateStr(item) {
    const d = new Date(item.start.dateTime + 'Z');
    return toDateStr(d);
  }

  // Pääaikajanalla päivän nimi näkyy työkalurivin otsikossa, joten päivätekstit
  // piirretään vain tapahtumamodaalin minikalenteriin (showDayLabels).
  function rulerHtml(anchor, showDayLabels = true) {
    const dates = bufferDates(anchor);
    const wdShort = weekdayShortArr();
    let html = '';
    dates.forEach((dateStr, i) => {
      const d = new Date(dateStr + 'T00:00:00');
      const label = wdShort[(d.getDay() + 6) % 7] + ' ' + d.getDate() + '.' + (d.getMonth() + 1) + '.';
      if (showDayLabels) {
        html += `<div class="day-label" style="left:${i * DAY_VISIBLE_PX}px; width:${DAY_VISIBLE_PX}px;">${label}</div>`;
      }
      // Päivän loppuotsikko osuu samaan kohtaan kuin seuraavan päivän alkuotsikko,
      // joten se piirretään vain viimeiselle päivälle.
      const lastHour = i === dates.length - 1 ? HOURS_END : HOURS_END - 1;
      for (let h = HOURS_START; h <= lastHour; h++) {
        const x = i * DAY_VISIBLE_PX + (h - HOURS_START) * HOUR_PX;
        html += `<div class="hour-label" style="left:${x}px;">${String(h).padStart(2, '0')}</div>`;
      }
    });
    return html;
  }

  function hourGridLinesHtml() {

  function busyBlocksHtml(items, anchor, who) {
    const dates = bufferDates(anchor);
    const winStart = HOURS_START * 60;
    const winEnd = HOURS_END * 60;
    let html = '';
    (items || []).forEach((item) => {
      if (item.status !== 'busy') return;
      const dateStr = itemDateStr(item);
      const dayIdx = dates.indexOf(dateStr);
      if (dayIdx === -1) return;

      const start = new Date(item.start.dateTime + 'Z');
      const end = new Date(item.end.dateTime + 'Z');
      let startMin = start.getHours() * 60 + start.getMinutes();
      let endMin = end.getHours() * 60 + end.getMinutes();
      if (endMin <= startMin) endMin = 1440;

      if (endMin <= winStart || startMin >= winEnd) return;
      startMin = Math.max(startMin, winStart);
      endMin = Math.min(endMin, winEnd);

      const leftPx = dayIdx * DAY_VISIBLE_PX + (startMin - winStart) * PX_PER_MIN;
      const widthPx = (endMin - startMin) * PX_PER_MIN;
      const locale = getCurrentLanguage() === 'en' ? 'en-GB' : 'fi-FI';
      const startLabel = start.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
      const endLabel = end.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
      const tip = who
        ? `${who} · ${t('busy_lower')} ${startLabel}–${endLabel}`
        : `${t('legend_busy')} ${startLabel}–${endLabel}`;
      html += `<div class="busy-block" style="left:${leftPx}px; width:${widthPx}px;" data-tip="${escapeAttr(tip)}"></div>`;
    });
    return html;
  }

    function restrictedBlocksHtml(ranges, anchor) {

    let html = '';

      let endMin = end.getHours() * 60 + end.getMinutes();
      if (endMin <= startMin) endMin = 1440;
      if (endMin <= winStart || startMin >= winEnd) return;
      startMin = Math.max(startMin, winStart);
      endMin = Math.min(endMin, winEnd);
      const leftPx = dayIdx * DAY_VISIBLE_PX + (startMin - winStart) * PX_PER_MIN;

  // Raidallinen "ei tietoa" -kaista päiväkohtaisesti, jotta teksti näkyy

  // Aikaväli pikselilohkoiksi näkyvän puskurin päiville (rajattuna päivän näkyvään ikkunaan).
  function intervalToBlocks(startMs, endMs) {
    const blocks = [];
    bufferDates().forEach((dateStr, dayIdx) => {
      const day = new Date(dateStr + 'T00:00:00').getTime();
      const winStart = day + HOURS_START * 3600000;
      const winEnd = day + HOURS_END * 3600000;
      const s0 = Math.max(startMs, winStart);
      const e0 = Math.min(endMs, winEnd);
      if (e0 <= s0) return;
      blocks.push({
        left: dayIdx * DAY_VISIBLE_PX + (s0 - winStart) / 60000 * PX_PER_MIN,
        width: (e0 - s0) / 60000 * PX_PER_MIN,
      });
    });
    return blocks;
  }

  function overlayBlocksHtml(cls, startMs, endMs, label, tip, onclick) {
    return intervalToBlocks(startMs, endMs).map((b) =>
      `<div class="ov-block ${cls}" style="left:${b.left}px; width:${b.width}px;" data-tip="${escapeAttr(tip)}" onclick="event.stopPropagation(); ${onclick}"><span>${escapeAttr(label)}</span></div>`
    ).join('');
  }

  function escapeAttr(str) {
    return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

  function formatHourMinute(d) {
    return d.getMinutes() === 0 ? String(d.getHours()) : d.getHours() + '.' + String(d.getMinutes()).padStart(2, '0');
  }

  // "Koko projekti" -rivi: valtuutettujen osallistujien varaukset yhdistettynä
  // ("joku varattu") ja niiden väliin jäävät yhteiset vapaat ajat ("kaikki
  // vapaina"). Vapaat ajat näytetään vain arkipäivien klo 8–18 väliltä — samat
  // rajat kuin aikaehdotuksissa — ettei esim. yö näy yhteisenä vapaana aikana.
  const ALL_FREE_DAY_START_HOUR = 8;
  const ALL_FREE_DAY_END_HOUR = 18;
  const ALL_FREE_MIN_MINUTES = 15;

  function wholeProjectCellHtml(participants, anchor) {
    const busy = [];
    participants.forEach((p) => {
      (p.scheduleItems || []).forEach((i) => {
        if (i.status !== 'busy') return;
        busy.push({ s: new Date(i.start.dateTime + 'Z').getTime(), e: new Date(i.end.dateTime + 'Z').getTime() });
      });
    });

    let html = '';
    bufferDates(anchor).forEach((dateStr, dayIdx) => {
      const day = new Date(dateStr + 'T00:00:00');
      const winStartMs = day.getTime() + HOURS_START * 3600000;
      const winEndMs = day.getTime() + HOURS_END * 3600000;
      const toPx = (ms) => dayIdx * DAY_VISIBLE_PX + (ms - winStartMs) / 60000 * PX_PER_MIN;

      // Päivän varaukset ikkunaan rajattuna ja yhdistettynä.
      const merged = [];
      busy
        .filter((b) => b.e > winStartMs && b.s < winEndMs)
        .map((b) => ({ s: Math.max(b.s, winStartMs), e: Math.min(b.e, winEndMs) }))
        .sort((a, b) => a.s - b.s)
        .forEach((b) => {
          const last = merged[merged.length - 1];
          if (last && b.s <= last.e) last.e = Math.max(last.e, b.e);
          else merged.push({ ...b });
        });

      merged.forEach((b) => {
        const tip = `${t('legend_someone_busy')} ${formatHourMinute(new Date(b.s))}–${formatHourMinute(new Date(b.e))}`;
        html += `<div class="someone-busy-block" style="left:${toPx(b.s)}px; width:${toPx(b.e) - toPx(b.s)}px;" data-tip="${tip}"></div>`;
      });

      const weekday = (day.getDay() + 6) % 7;
      if (weekday >= 5) return;
      const freeFrom = Math.max(winStartMs, day.getTime() + ALL_FREE_DAY_START_HOUR * 3600000);
      const freeTo = Math.min(winEndMs, day.getTime() + ALL_FREE_DAY_END_HOUR * 3600000);
      let cursor = freeFrom;
      const gaps = [];
      merged.forEach((b) => {
        if (b.s > cursor) gaps.push({ s: cursor, e: Math.min(b.s, freeTo) });
        cursor = Math.max(cursor, b.e);
      });
      if (cursor < freeTo) gaps.push({ s: cursor, e: freeTo });

      gaps
        .filter((g) => g.e - g.s >= ALL_FREE_MIN_MINUTES * 60000)
        .forEach((g) => {
          const label = `${formatHourMinute(new Date(g.s))}–${formatHourMinute(new Date(g.e))}`;
          const width = toPx(g.e) - toPx(g.s);
          html += `<div class="all-free-block" style="left:${toPx(g.s)}px; width:${width}px;" data-tip="${t('legend_all_free')} ${label}">${width >= 56 ? label : ''}</div>`;
        });
    });
    return html;
  }

  // Hallintaoikeus palvelimen laskemana (viewerAccess: vastuuhenkilö, projektin admin,
  // omistavan organisaation pääkäyttäjä, superadmin).
  function isAdminForProject(status) {
    if (!status) return false;
    if (status.viewerAccess) return !!status.viewerAccess.canManage;
    if (status.project.owner_email.toLowerCase() === currentUserEmail) return true;
    return status.participants.some(
      (p) => p.email.toLowerCase() === currentUserEmail && p.role === 'admin' && p.status === 'authorized'
    );
  }

  // Vastuuhenkilön vaihto ja projektin poisto: vain vastuuhenkilö, omistavan
  // organisaation pääkäyttäjä ja superadmin (sama ehto kuin update-project/delete-project).
  function canOwnProject(status) {
    const va = status && status.viewerAccess;
    return !!va && (va.isOwner || va.isOrgSuperuser || va.isSuperadmin);
  }

  function isParticipantInProject(status) {
    const va = status && status.viewerAccess;
    return va ? va.isParticipant : true;
  }

    if (!latestStatus) return false;

  // Päivämäärä pysyy aikajanan vasemmassa reunassa vieritettäessä, kunnes
  // seuraavan päivän päivämäärä työntää sen pois näkyvistä.
  function positionDayLabels() {
    const col = document.getElementById('mainTimelineCol');
    if (!col) return;
    const scrollLeft = col.scrollLeft;
    document.querySelectorAll('#mainRuler .sticky-day-label').forEach((el) => {
      const i = Number(el.dataset.day);
      const dayStart = i * DAY_VISIBLE_PX;
      const pushLimit = (i + 1) * DAY_VISIBLE_PX - el.offsetWidth - 8;
      el.style.left = Math.max(dayStart, Math.min(scrollLeft, pushLimit)) + 'px';
    });
  }

  function pageBuffer(direction) {

    document.getElementById('viewDate').value = anchorDateStr;

  function attachMasterPaging() {
    const master = document.getElementById('mainTimelineCol');
    master.addEventListener('scrollend', () => {
      const max = master.scrollWidth - master.clientWidth;
      if (master.scrollLeft >= max - 4) {
        pageBuffer(1);
      } else if (master.scrollLeft <= 0) {
        pageBuffer(-1);
      }
    });
  }

    async function startCalendarAuthForParticipant(participantId, wantsWrite) {
    const { data: { session } } = await client.auth.getSession();
    const provider = session?.user?.app_metadata?.provider;

    if (provider === 'google') {
      const authUrl = new URL('https://accounts.google.com/o/oauth2/v2/auth');
      authUrl.searchParams.set('client_id', GOOGLE_CLIENT_ID);
      authUrl.searchParams.set('response_type', 'code');
      authUrl.searchParams.set('redirect_uri', GOOGLE_CALENDAR_REDIRECT_URI);
      authUrl.searchParams.set('scope', 'https://www.googleapis.com/auth/calendar.readonly');
      authUrl.searchParams.set('access_type', 'offline');
      authUrl.searchParams.set('prompt', 'consent');
      authUrl.searchParams.set('state', `${participantId}||p:${PROJECT_ID}`);
      window.location.href = authUrl.toString();
      return;
    }

    // Jos kirjoitusoikeus on jo annettu, säilytetään se myös silloin kun
    // valtuutus uusitaan lukuoikeuden napista — muuten oikeus katoaisi hiljaisesti.
    const write = !!wantsWrite;
    const authUrl = new URL('https://login.microsoftonline.com/common/oauth2/v2.0/authorize');
    authUrl.searchParams.set('client_id', CLIENT_ID);
    authUrl.searchParams.set('response_type', 'code');
    authUrl.searchParams.set('redirect_uri', CALENDAR_REDIRECT_URI);
    authUrl.searchParams.set('response_mode', 'query');
    authUrl.searchParams.set('scope', write
      ? 'User.Read Calendars.Read Calendars.ReadWrite offline_access'
      : 'User.Read Calendars.Read offline_access');
       // Kolmas osa kertoo auth-callbackille että paluu tapahtuu tälle projektisivulle.
      authUrl.searchParams.set('state', `${participantId}|${write ? 'rw' : ''}|p:${PROJECT_ID}`);
    window.location.href = authUrl.toString();
  }

  async function submitAddParticipant() {
    const rowsToSend = npRows.filter((r) => r.email.trim() !== '');

    const links = [];

    for (const r of rowsToSend) {
      const data = await submitParticipantInvite(r.email.trim(), r.firstName, r.lastName, r.title, r.role);
      if (data.error) errors.push(`${r.email}: ${data.error}`);
      else links.push(`${t('invite_link_label')} (${r.email}): <a href="${data.inviteLink}" target="_blank">${data.inviteLink}</a>`);

    closeModal();
    document.getElementById('inviteResult').innerHTML = links.join('<br>') + (errors.length ? '<br>' + t('error_prefix') + ': ' + errors.join(', ') : '');
    loadStatus();

  function reminderSectionHtml(p) {

    const last = p.lastReminderAt ? new Date(p.lastReminderAt) : null;
    const recent = last && (Date.now() - last.getTime()) < 24 * 3600 * 1000;
    const lastText = last
      ? t('reminder_last_sent', { when: last.toLocaleString(getCurrentLanguage() === 'en' ? 'en-GB' : 'fi-FI', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) })

  const RECUR_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M13 6.5A5 5 0 0 0 3.6 4.6M3 9.5a5 5 0 0 0 9.4 1.9"/><path d="M3.5 2v3h3M12.5 14v-3h-3"/></svg>';

  function eventRowHtml(e, seg, showDetails) {

    (e.optional_ids || []).forEach((id) => chips.push(`<span class="ev-chip optional">${escapeHtmlText(participantName(id))}</span>`));

      : '';

  async function cancelProjectEvent(eventId, scope) {
    const e = projectEvents.find((x) => x.id === eventId);
    if (!e) return;
    const key = scope === 'future' ? 'confirm_cancel_future' : 'confirm_cancel_event';
    if (!confirm(t(key, { title: e.title, time: formatDayHeading(e.startMs) + ' ' + formatTimeRange(e.startMs, e.endMs) }))) return;
    try {
      const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/cancel-project-event`, {
        method: 'POST',
        body: JSON.stringify({ projectId: PROJECT_ID, eventId, scope }),
      });
      const data = await res.json();
      if (data.error) { alert(t('error_prefix') + ': ' + data.error); return; }

      await loadProjectEvents();
    } catch (err) {
      alert(t('error_prefix') + ': ' + err.message);

  function formatClock(ms) {
    const locale = getCurrentLanguage() === 'en' ? 'en-GB' : 'fi-FI';
    return new Date(ms).toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
  }

  // Koko aikaväli: samana päivänä "Ma 19.10.2026 10.00–11.00", useana päivänä
  // "Ke 15.10.2026 10.00 – Ti 21.10.2026 11.00".
  function formatEventSpan(startMs, endMs) {
    if (toDateStr(new Date(startMs)) === toDateStr(new Date(endMs - 1))) {
      return `${formatDayHeading(startMs)} ${formatTimeRange(startMs, endMs)}`;
    }
    return `${formatDayHeading(startMs)} ${formatClock(startMs)} – ${formatDayHeading(endMs)} ${formatClock(endMs)}`;
  }

  // Monipäiväinen tapahtuma pilkotaan päiväkohtaisiksi osiksi, jotta se näkyy
  // listalla jokaisella päivällä: 1. päivä alku–23.59, välipäivät 00.00–23.59,
  // viimeinen 00.00–loppu.
  function eventDaySegments(e) {
    const segs = [];
    let dayStart = new Date(e.startMs); dayStart.setHours(0, 0, 0, 0);
    while (dayStart.getTime() < e.endMs) {
      const next = new Date(dayStart); next.setDate(next.getDate() + 1);
      const segStart = Math.max(e.startMs, dayStart.getTime());
      const segEnd = Math.min(e.endMs, next.getTime());
      if (segEnd > segStart) {
        const single = segStart === e.startMs && segEnd === e.endMs;
        const label = single
          ? formatTimeRange(e.startMs, e.endMs)
          : `${formatClock(segStart)}–${segEnd === e.endMs ? formatClock(segEnd) : formatClock(next.getTime() - 60000)}`;
        segs.push({ event: e, startMs: segStart, endMs: segEnd, label });
      }
      dayStart = next;
    }
    return segs;
  }

  // segments: [{ event, startMs, endMs, label }] valmiiksi järjestettynä.
  function eventDayGroupsHtml(segments, shownDetails) {
    let html = '';
    let currentDay = null;
    segments.forEach((seg) => {
      const day = toDateStr(new Date(seg.startMs));
      if (day !== currentDay) {
        currentDay = day;
        html += `<div class="ev-day">${formatDayHeading(seg.startMs)}</div>`;
      }
      // Avatut tiedot näytetään vain tapahtuman ensimmäisellä näkyvällä rivillä.
      const showDetails = expandedEventId === seg.event.id && !shownDetails.has(seg.event.id);
      if (showDetails) shownDetails.add(seg.event.id);
      html += eventRowHtml(seg.event, seg, showDetails);
    });
    return html;
  }

  function eventsListHtml() {
    if (!projectEvents.length) return `<p class="panel-note">${t('events_empty')}</p>`;
    const now = Date.now();
    const segments = projectEvents.flatMap(eventDaySegments);
    const upcoming = segments.filter((g) => g.endMs >= now).sort((a, b) => a.startMs - b.startMs);
    // Menneet päivät uusimmasta vanhimpaan; laskuriin tapahtumat (ei päiviä).
    const past = segments.filter((g) => g.endMs < now).sort((a, b) => b.startMs - a.startMs);
    const pastEventCount = new Set(past.map((g) => g.event.id)).size;
    const shownDetails = new Set();

    let html = upcoming.length
      ? `<div class="ev-scroll"><div class="ev-list">${eventDayGroupsHtml(upcoming, shownDetails)}</div></div>`
      : `<p class="panel-note">${t('events_no_upcoming')}</p>`;
    if (past.length) {
      html += `<button type="button" class="past-link" onclick="togglePastEvents()">${showPastEvents ? t('hide_past_events') : t('past_events_link', { count: pastEventCount })}</button>`;
      if (showPastEvents) html += `<div class="ev-scroll ev-past"><div class="ev-list">${eventDayGroupsHtml(past, shownDetails)}</div></div>`;
    }
    return html;
  }

  async function loadDrafts() {
    try {
      const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/event-drafts`, {
        method: 'POST',
        body: JSON.stringify({ action: 'list', projectId: PROJECT_ID }),
      });
      const data = await res.json();
      myDrafts = data.drafts || [];

      myDrafts = [];

      if (latestStatus) renderAll();

  // Luonnoksen kerrat aikaväleinä (toistuvalla kaikki kerrat).
  function draftIntervals(payload) {
    if (!payload) return [];
    if (payload.mode === 'recurring' && Array.isArray(payload.occurrences) && payload.occurrences.length) {
      return payload.occurrences.map((o) => ({ startMs: o.startMs, endMs: o.endMs }));
    }
    if (payload.selStart && payload.selEnd) return [{ startMs: payload.selStart, endMs: payload.selEnd }];
    return [];
  }

  // Omat luonnokset varattuina aikahaussa (ei muokattavana olevaa luonnosta itseään).
  function ownDraftBusy(excludeDraftId) {
    return myDrafts
      .filter((d) => d.id !== excludeDraftId)
      .flatMap((d) => draftIntervals(d.payload));
  }

  // Luonnoksen osallistujat, joita ei enää ole projektissa, pudotetaan pois.
  function pruneDraftRoles(payload) {
    const peopleRoles = {};
    const groupRoles = {};
    let removed = 0;
    Object.entries(payload.peopleRoles || {}).forEach(([id, role]) => {
      if (latestStatus.participants.some((p) => p.id === id)) peopleRoles[id] = role;
      else removed++;
    });
    Object.entries(payload.groupRoles || {}).forEach(([id, role]) => {
      if ((latestStatus.groups || []).some((g) => g.id === id)) groupRoles[id] = role;
      else removed++;
    });
    return { peopleRoles, groupRoles, removed };
  }

  // Pakollisten osallistujien (myös ryhmien) nimet, joilla on päällekkäisyys jollain kerralla.
  function draftConflicts(payload, roles, draftId) {
    const intervals = draftIntervals(payload);
    const names = [];
    Object.entries(roles.peopleRoles).forEach(([id, role]) => {
      if (role !== 'required') return;
      const busy = resolvePersonBusy(id);
      if (intervals.some((iv) => busy.some((b) => overlapsMs(iv.startMs, iv.endMs, b.startMs, b.endMs)))) {
        const p = latestStatus.participants.find((x) => x.id === id);
        if (p) names.push(nameLabelFor(p));
      }
    });
    Object.entries(roles.groupRoles).forEach(([id, role]) => {
      if (role !== 'required') return;
      const busy = resolveGroupBusy(id);
      if (intervals.some((iv) => busy.some((b) => overlapsMs(iv.startMs, iv.endMs, b.startMs, b.endMs)))) {
        const g = (latestStatus.groups || []).find((x) => x.id === id);
        if (g) names.push(g.name);
      }
    });
    const others = ownDraftBusy(draftId);
    const overlapsDraft = intervals.some((iv) => others.some((b) => overlapsMs(iv.startMs, iv.endMs, b.startMs, b.endMs)));
    return { names, overlapsDraft };
  }

  function escapeHtmlText(str) {
    return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function draftsListHtml() {
    if (!myDrafts.length) return `<p class="panel-note">${t('drafts_empty')}</p>`;
    const now = Date.now();
    return myDrafts.map((d) => {
      const payload = d.payload || {};
      const intervals = draftIntervals(payload);
      const roles = pruneDraftRoles(payload);
      const isPast = intervals.length > 0 && intervals[intervals.length - 1].endMs < now;
      const timeLabel = intervals.length ? formatSlotLabel(intervals[0]) : '–';
      const flags = [];
      if (isPast) flags.push(`<span class="draft-flag warn">${t('draft_past')}</span>`);
      if (intervals.length > 1) flags.push(`<span class="draft-flag">${t('draft_recurring', { count: intervals.length })}</span>`);
      const attendeeCount = Object.keys(roles.peopleRoles).length + Object.keys(roles.groupRoles).length;
      flags.push(`<span class="draft-flag">${t('draft_attendees', { count: attendeeCount })}</span>`);
      if (!isPast) {
        const c = draftConflicts(payload, roles, d.id);
        if (c.names.length) flags.push(`<span class="draft-flag warn">${t('draft_conflict', { names: escapeHtmlText(c.names.join(', ')) })}</span>`);
        if (c.overlapsDraft) flags.push(`<span class="draft-flag info">${t('draft_conflict_draft')}</span>`);
      }
      if (roles.removed) flags.push(`<span class="draft-flag info">${t('draft_removed', { count: roles.removed })}</span>`);
      return `
        <div class="draft-row ${isPast ? 'past' : ''}">
          <div class="dr-main">
            <div class="dr-title"><button type="button" class="dr-title-btn" onclick="toggleDraftDetails('${d.id}')" aria-expanded="${expandedDraftId === d.id}">${escapeHtmlText(d.title || t('draft_untitled'))}</button></div>
            <div class="dr-time">${timeLabel}</div>
            <div class="dr-flags">${flags.join('')}</div>
          </div>
          <div class="dr-actions">
            <button type="button" onclick="publishDraft('${d.id}')">${t('draft_publish_btn')}</button>
            <button type="button" class="secondary" onclick="editDraft('${d.id}')">${t('draft_edit_btn')}</button>
            <button type="button" class="danger" onclick="deleteDraft('${d.id}')">${t('draft_delete_btn')}</button>
          </div>
          ${expandedDraftId === d.id ? draftDetailsHtml(d, roles, intervals) : ''}
        </div>
      `;
    }).join('');
  }

  // Tallennettavat kentät: kaikki tapahtuman luonnissa syötetyt tiedot.
  const DRAFT_FIELDS = ['duration', 'peopleRoles', 'groupRoles', 'rangeFrom', 'rangeTo', 'preferMorning', 'preferMidday',
    'preferAfternoon', 'mode', 'rec', 'recRule', 'occurrences', 'selStart', 'selEnd', 'inviteTitle', 'inviteBody', 'inviteHidden'];

  async function saveAsDraft() {
    const s = eventModalState;
    const payload = {};
    DRAFT_FIELDS.forEach((f) => { if (s[f] !== undefined) payload[f] = s[f]; });
    if (!isRecurringSeries()) payload.occurrences = null;
    const intervals = draftIntervals(payload);
    const btn = document.getElementById('saveDraftBtn');
    if (btn) btn.disabled = true;

    try {
      const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/event-drafts`, {
        method: 'POST',
        body: JSON.stringify({
          action: 'save',
          projectId: PROJECT_ID,
          draftId: s.draftId || null,
          title: s.inviteTitle || '',
          payload,
          firstStartAt: intervals.length ? new Date(intervals[0].startMs).toISOString() : null,
          lastEndAt: intervals.length ? new Date(intervals[intervals.length - 1].endMs).toISOString() : null,
        }),
      });
      const data = await res.json();
      if (data.error) {
        alert(t('error_prefix') + ': ' + data.error);
        if (btn) btn.disabled = false;
        return;
      }
      closeModal();
      eventModalState = null;
      await loadDrafts();
      showInlineNote(t('draft_saved'));
    } catch (err) {
      alert(t('error_prefix') + ': ' + err.message);
      if (btn) btn.disabled = false;
    }
  }

  function showInlineNote(text) {
    const el = document.getElementById('inviteResult');
    el.textContent = text;
    el.style.color = 'var(--ok)';
    setTimeout(() => { el.textContent = ''; el.style.color = ''; }, 6000);

  // luonnoksesta ei voi jatkaa (esim. kaikki osallistujat poistettu).
  function restoreDraftState(draftId) {
    const d = myDrafts.find((x) => x.id === draftId);
    if (!d || !latestStatus) return false;
    const payload = JSON.parse(JSON.stringify(d.payload || {}));
    const roles = pruneDraftRoles(payload);

    eventModalState = {
      duration: 30, rangeFrom: '', rangeTo: '', preferMorning: false, preferMidday: false, preferAfternoon: false,
      mode: 'single', rec: defaultRecurrenceState(), recRule: null, recCtx: null, occurrences: null,
      results: null, selectedResultIdx: 0, calAnchor: null, selStart: null, selEnd: null,
      ...payload,
      peopleRoles: roles.peopleRoles,
      groupRoles: roles.groupRoles,
      draftId: d.id,
      draftRemovedCount: roles.removed,
    };
    const s = eventModalState;
    if (s.selStart && s.selEnd) {
      s.results = [{ startMs: s.selStart, endMs: s.selEnd }];
      s.calAnchor = toDateStr(new Date(s.selStart));
    }
    if (Object.keys(s.peopleRoles).length + Object.keys(s.groupRoles).length === 0) return true;

  function resolvePersonBusy(id) {
    const p = latestStatus.participants.find((x) => x.id === id);
    if (!p || !p.scheduleItems) return [];
    return p.scheduleItems
      .filter((i) => i.status === 'busy')
      .map((i) => ({ startMs: new Date(i.start.dateTime + 'Z').getTime(), endMs: new Date(i.end.dateTime + 'Z').getTime() }));
  }

  function resolveGroupBusy(id) {
    const g = (latestStatus.groups || []).find((x) => x.id === id);
    if (!g) return [];
    return groupMergedItems(g)
      .filter((i) => i.status === 'busy')
      .map((i) => ({ startMs: new Date(i.start.dateTime + 'Z').getTime(), endMs: new Date(i.end.dateTime + 'Z').getTime() }));
  }

  function overlapsMs(s1, e1, s2, e2) {
    return s1 < e2 && s2 < e1;
  }

  function findAvailableSlots(opts) {
    const { durationMinutes, requiredBusy, optionalBusyLists, searchStart, searchEnd, preferWindows } = opts;
    const durationMs = durationMinutes * 60000;
    const stepMs = 15 * 60000;
    const dayStartHour = 8;
    const dayEndHour = 18;

    let cursor = new Date(searchStart);
    cursor.setSeconds(0, 0);
    const rem = cursor.getMinutes() % 15;
    if (rem !== 0) cursor.setMinutes(cursor.getMinutes() + (15 - rem));

    const candidates = [];
    let guard = 0;
    while (cursor.getTime() + durationMs <= searchEnd.getTime() && guard < 20000) {
      guard++;
      const day = cursor.getDay();
      const hour = cursor.getHours() + cursor.getMinutes() / 60;
      const endHourFrac = hour + durationMinutes / 60;
      const withinDay = day !== 0 && day !== 6 && hour >= dayStartHour && endHourFrac <= dayEndHour;

      if (withinDay) {
        const slotStart = cursor.getTime();
        const slotEnd = slotStart + durationMs;
        const conflictsRequired = requiredBusy.some((b) => overlapsMs(slotStart, slotEnd, b.startMs, b.endMs));

        if (!conflictsRequired) {
          let optionalConflicts = 0;
          optionalBusyLists.forEach((list) => {
            if (list.some((b) => overlapsMs(slotStart, slotEnd, b.startMs, b.endMs))) optionalConflicts++;
          });
          const prefersMatch = preferWindows.length === 0 ? true : preferWindows.some((w) => hour >= w.start && hour < w.end);
          candidates.push({ startMs: slotStart, endMs: slotEnd, optionalConflicts, prefersMatch });
        }
      }
      cursor = new Date(cursor.getTime() + stepMs);
    }

    candidates.sort((a, b) => {
      if (a.prefersMatch !== b.prefersMatch) return a.prefersMatch ? -1 : 1;
      if (a.optionalConflicts !== b.optionalConflicts) return a.optionalConflicts - b.optionalConflicts;
      return a.startMs - b.startMs;
    });

    const chosen = [];
    for (const c of candidates) {
      if (chosen.some((ch) => overlapsMs(c.startMs, c.endMs, ch.startMs, ch.endMs))) continue;
      chosen.push(c);
      if (chosen.length >= 5) break;
    }
    return chosen;
  }

  // Pakollisten ja valinnaisten osallistujien varatut ajat valinnoista.
  // Palauttaa null (ja näyttää ilmoituksen), jos ketään ei ole valittu.
  function collectEventBusy() {
    const s = eventModalState;
    const requiredIds = { people: [], groups: [] };
    const optionalIds = { people: [], groups: [] };

    Object.entries(s.peopleRoles).forEach(([id, role]) => (role === 'required' ? requiredIds.people : optionalIds.people).push(id));
    Object.entries(s.groupRoles).forEach(([id, role]) => (role === 'required' ? requiredIds.groups : optionalIds.groups).push(id));

    if (requiredIds.people.length + requiredIds.groups.length + optionalIds.people.length + optionalIds.groups.length === 0) {
      alert(t('alert_select_attendee'));
      return null;
    }

    // Omat luonnokset käsitellään varattuina (vain tekijälle — muut eivät näe niitä).
    const requiredBusy = [
      ...requiredIds.people.flatMap(resolvePersonBusy),
      ...requiredIds.groups.flatMap(resolveGroupBusy),
      ...ownDraftBusy(s.draftId),
    ];
    const optionalBusyLists = [
      ...optionalIds.people.map(resolvePersonBusy),
      ...optionalIds.groups.map(resolveGroupBusy),
    ];
    return { requiredBusy, optionalBusyLists };
  }

  function searchEventSlots() {
    const s = eventModalState;
    const busy = collectEventBusy();
    if (!busy) return;
    const { requiredBusy, optionalBusyLists } = busy;

    const now = new Date();
    const searchStart = s.rangeFrom ? new Date(s.rangeFrom) : now;
    const searchEnd = s.rangeTo ? new Date(s.rangeTo) : new Date(now.getTime() + 90 * 24 * 60 * 60 * 1000);

    const preferWindows = [];
    if (s.preferMorning) preferWindows.push({ start: 8, end: 11 });
    if (s.preferMidday) preferWindows.push({ start: 11, end: 14 });
    if (s.preferAfternoon) preferWindows.push({ start: 14, end: 17 });

    const results = findAvailableSlots({
      durationMinutes: Number(s.duration) || 30,
      requiredBusy,
      optionalBusyLists,
      searchStart,
      searchEnd,
      preferWindows,
    });

    if (results.length === 0) {
      alert(t('alert_no_slots_found'));
      return;
    }

    s.results = results;
    s.selectedResultIdx = 0;
    s.selStart = results[0].startMs;
    s.selEnd = results[0].endMs;
    s.calAnchor = toDateStr(new Date(results[0].startMs));
    renderEventResultsStep();
  }

  // Kalenteridata haetaan 3 kk eteenpäin (ks. kalenterien päivitys) —
  // sen jälkeisiä aikoja ei voi tarkistaa.
  function scheduleHorizonMs() {
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth() + 3, now.getDate()).getTime();
  }

  function parseDateInput(value) {
    if (!value) return null;
    const [y, m, d] = value.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function recRuleFromState(r) {
    return { freq: r.freq, weekday: r.weekday, nth: r.nth, month: r.month };
  }

  // Validoi päättymisehdon; palauttaa { count, endDate } tai null.
  function recEndCondition(r) {
    if (r.endType === 'count') {
      const count = Number(r.count);
      if (!Number.isInteger(count) || count < 2 || count > RECURRENCE_MAX_OCCURRENCES) {
        alert(t('rec_alert_count'));
        return null;
      }
      return { count, endDate: null };
    }
    const endDate = parseDateInput(r.endDate);
    const startFrom = parseDateInput(r.startFrom) || new Date();
    if (!endDate || endDate <= recStartOfDay(startFrom)) {
      alert(t('rec_alert_end_date'));
      return null;
    }
    return { count: null, endDate };
  }

  // Toistuvan tapahtuman vaihe 1 → 2: näytetään ensimmäisen kerran
  // ehdotukset säännön mukaisesta ensimmäisestä päivästä alkaen.
  function searchRecurringFirstSlot() {
    const s = eventModalState;
    const r = s.rec;
    const busy = collectEventBusy();
    if (!busy) return;
    if (!recEndCondition(r)) return;

    // Aikaisintaan huomisesta, ettei ensimmäiseksi ehdoteta jo mennyttä aikaa.
    const tomorrow = recAddDays(recStartOfDay(new Date()), 1);
    const startFrom = parseDateInput(r.startFrom);
    const from = startFrom && startFrom > tomorrow ? startFrom : tomorrow;
    const firstDate = recNextMatchingDate(recRuleFromState(r), from);
    if (!firstDate) { alert(t('alert_no_slots_found')); return; }

    const win = RECURRENCE_TIME_WINDOWS[r.window];
    const durationMinutes = Number(s.duration) || 30;
    const searchDays = r.freq === 'monthly' || r.freq === 'yearly' ? 4 : 1;
    const searchStart = new Date(Math.max(firstDate.getTime(), Date.now()));
    const searchEnd = recAddDays(firstDate, searchDays);

    let results = findAvailableSlots({
      durationMinutes,
      requiredBusy: busy.requiredBusy,
      optionalBusyLists: busy.optionalBusyLists,
      searchStart,
      searchEnd,
      preferWindows: [win],
    });

    // Ei vapaata: näytetään silti säännön mukainen aika, jota käyttäjä voi siirtää.
    if (results.length === 0) {
      const start = new Date(firstDate);
      start.setHours(win.start, 0, 0, 0);
      results = [{ startMs: start.getTime(), endMs: start.getTime() + durationMinutes * 60000 }];
    }

    s.results = results;
    s.selectedResultIdx = 0;
    s.selStart = results[0].startMs;
    s.selEnd = results[0].endMs;
    s.calAnchor = toDateStr(new Date(results[0].startMs));
    s.occurrences = null;
    renderEventResultsStep();
  }

  // Vaihe 2 → 3: valittu ensimmäinen aika määrittää standardin
  // (kellonaika, kesto ja säännön viikonpäivä) tuleville kerroille.
  function buildRecurringOccurrences() {
    const s = eventModalState;
    const r = s.rec;
    const end = recEndCondition(r);
    if (!end) return false;
    const busy = collectEventBusy();
    if (!busy) return false;

    const firstDate = new Date(s.selStart);
    const rule = recDeriveRuleFromDate(recRuleFromState(r), firstDate);
    if (!recMatchesRule(firstDate, rule)) {
      alert(t('rec_alert_weekday_only'));
      return false;
    }

    const ctx = { ...busy, horizonMs: scheduleHorizonMs(), nowMs: Date.now() };
    const occurrences = recBuildOccurrences({
      rule,
      firstStartMs: s.selStart,
      durationMs: s.selEnd - s.selStart,
      count: end.count,
      endDate: end.endDate,
      smart: r.smart,
    }, ctx);

    if (occurrences.length > RECURRENCE_MAX_OCCURRENCES) { alert(t('rec_alert_too_many')); return false; }
    if (occurrences.length < 2) { alert(t('rec_alert_too_few')); return false; }

    s.recRule = rule;
    s.recCtx = ctx;
    s.occurrences = occurrences;
    return true;
  }

  function continueRecurring() {
    if (!buildRecurringOccurrences()) return;
    if (eventModalState.rec.smart) renderOccurrenceListStep();
    else openInviteConfirmStep();
  }

  function renderOccurrenceListStep() {
    const s = eventModalState;
    const rows = s.occurrences.map((o, idx) => `
      <div class="occ-row">
        <span class="occ-idx">${idx + 1}.</span>
        <span class="occ-label">${formatSlotLabel(o)}</span>
        <input type="datetime-local" value="${formatDatetimeLocal(o.startMs)}" onchange="updateOccurrenceStart(${idx}, this.value)" />
        <span class="occ-badge occ-${o.status}">${t('occ_status_' + o.status)}</span>
        <button type="button" class="remove-x" title="${t('remove_btn_title')}" onclick="removeOccurrence(${idx})">✕</button>
      </div>
    `).join('');

    document.getElementById('modalHost').innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal event-modal">
          <h3>${t('rec_occurrences_heading')}</h3>
          ${draftEditNoteHtml()}
          <p class="rec-hint">${recurrenceSummaryText()}</p>
          <p class="rec-hint">${t('rec_occ_hint')}</p>
          <div class="occ-list">${rows}</div>
          <div class="actions">
            <button class="secondary" onclick="renderEventResultsStep()">${t('back_btn')}</button>
            <button class="secondary" onclick="refetchOccurrenceTimes()">${t('rec_refetch_btn')}</button>
            <button onclick="openInviteConfirmStep()">${eventModalState.draftId ? t('save_draft_btn') : t('rec_create_invites_btn')}</button>
          </div>
        </div>
      </div>
    `;
  }

  function updateOccurrenceStart(idx, value) {
    const s = eventModalState;
    const startMs = new Date(value).getTime();
    if (isNaN(startMs)) return;
    const o = s.occurrences[idx];
    const durationMs = o.endMs - o.startMs;
    o.startMs = startMs;
    o.endMs = startMs + durationMs;
    o.status = recOccurrenceStatus(o.startMs, o.endMs, o.targetStartMs, s.recCtx);
    s.occurrences.sort((a, b) => a.startMs - b.startMs);
    renderOccurrenceListStep();
  }

  function removeOccurrence(idx) {
    const s = eventModalState;
    if (s.occurrences.length <= 1) { alert(t('rec_alert_no_occurrences')); return; }
    s.occurrences.splice(idx, 1);
    renderOccurrenceListStep();
  }

  function formatDateShort(ms) {
    const d = new Date(ms);
    return d.getDate() + '.' + (d.getMonth() + 1) + '.' + d.getFullYear();
  }

  function recurrenceSummaryText() {
    const s = eventModalState;
    const rule = s.recRule;
    const occ = s.occurrences;
    const vars = {
      weekday: weekdayFullArr()[rule.weekday],
      nth: t('rec_nth_' + rule.nth),
      month: t('rec_month_nom_' + rule.month),
    };
    const first = new Date(occ[0].startMs);
    const locale = getCurrentLanguage() === 'en' ? 'en-GB' : 'fi-FI';
    const fmt = (d) => d.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
    const time = fmt(first) + '–' + fmt(new Date(occ[0].endMs));
    return t('rec_summary_' + rule.freq, vars) + ' · ' + t('rec_summary_details', {
      time,
      count: occ.length,
      first: formatDateShort(occ[0].startMs),
      last: formatDateShort(occ[occ.length - 1].startMs),
    });
  }

  function isRecurringSeries() {
    return eventModalState.mode === 'recurring' && !!eventModalState.occurrences;
  }

  function formatSlotLabel(slot) {
    const start = new Date(slot.startMs);
    const end = new Date(slot.endMs);
    const wd = weekdayShortArr()[(start.getDay() + 6) % 7];
    const dateStr = start.getDate() + '.' + (start.getMonth() + 1) + '.';
    const locale = getCurrentLanguage() === 'en' ? 'en-GB' : 'fi-FI';
    const startTime = start.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
    const endTime = end.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
    return `${wd} ${dateStr} ${startTime}–${endTime}`;
  }

  // Käyttäjän valitsema aika (ehdotus tai raahattu/muokattu valinta).
  function selectedSlot() {
    return { startMs: eventModalState.selStart, endMs: eventModalState.selEnd };
  }

  function eventSelectedAttendees() {
    const s = eventModalState;
    const people = Object.keys(s.peopleRoles)
      .map((id) => latestStatus.participants.find((p) => p.id === id))
      .filter(Boolean);
    const groups = Object.keys(s.groupRoles)
      .map((id) => (latestStatus.groups || []).find((g) => g.id === id))
      .filter(Boolean);
    return { people, groups };
  }

  // ---- Valitun ajan raahaus/venytys-toiminnot ----

  function pxForTimestamp(ms, anchor) {
    const d = new Date(ms);
    const dayIdx = bufferDates(anchor).indexOf(toDateStr(d));
    if (dayIdx === -1) return null;
    const minutes = d.getHours() * 60 + d.getMinutes();
    return dayIdx * DAY_VISIBLE_PX + (minutes - HOURS_START * 60) * PX_PER_MIN;
  }

  function eventSelectionOverlayHtml(items) {
    const s = eventModalState;
    if (!s.selStart || !s.selEnd) return '';
    const left = pxForTimestamp(s.selStart, s.calAnchor);
    const right = pxForTimestamp(s.selEnd, s.calAnchor);
    if (left === null || right === null) return '';
    const conflict = (items || []).some((i) =>
      i.status === 'busy' && overlapsMs(s.selStart, s.selEnd, new Date(i.start.dateTime + 'Z').getTime(), new Date(i.end.dateTime + 'Z').getTime())
    );
    return `<div class="sel-overlay ${conflict ? 'sel-overlay-conflict' : 'sel-overlay-free'}" style="left:${left}px; width:${right - left}px;"></div>`;
  }

  function formatDatetimeLocal(ms) {
    const d = new Date(ms);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')
      + 'T' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function timestampForClickX(xOffset, anchor) {
    const dayIdx = Math.floor(xOffset / DAY_VISIBLE_PX);
    const dates = bufferDates(anchor);
    const dateStr = dates[dayIdx];
    if (!dateStr) return null;
    const withinDayPx = xOffset - dayIdx * DAY_VISIBLE_PX;
    const minutesFromWindowStart = withinDayPx / PX_PER_MIN;
    const totalMinutes = HOURS_START * 60 + minutesFromWindowStart;
    const snappedMinutes = Math.round(totalMinutes / 15) * 15;
    const d = new Date(dateStr + 'T00:00:00');
    d.setMinutes(snappedMinutes);
    return d.getTime();
  }

  function onTimelineRowClick(e) {
    if (e.target.closest('.sel-overlay')) return;
    const cell = e.currentTarget.querySelector('.timeline-cell');
    if (!cell) return;
    const rect = cell.getBoundingClientRect();
    const xOffset = e.clientX - rect.left;
    const clicked = timestampForClickX(xOffset, eventModalState.calAnchor);
    if (clicked === null) return;

    // Aikajana ei liiku: valintalaatikko siirtyy klikattuun kohtaan samalla kestolla.
    const duration = eventModalState.selEnd - eventModalState.selStart;
    eventModalState.selStart = clicked;
    eventModalState.selEnd = clicked + duration;
    renderEventResultsStep({ scroll: 'keep' });
  }

  // Suoraan DOM:iin kohdistuva, kevyt päivitys raahauksen AIKANA — ei
  // koko modaalin uudelleenpiirtoa, jotta liike pysyy sulavana. Rajattu
  // tarkoituksella vain #modalHostin sisälle, ei koko dokumenttiin.
  function updateSelectionOverlaysInPlace() {
    const s = eventModalState;
    const left = pxForTimestamp(s.selStart, s.calAnchor);
    const right = pxForTimestamp(s.selEnd, s.calAnchor);
    if (left === null || right === null) return;

    document.querySelectorAll('#modalHost .sel-overlay').forEach((el) => {
      el.style.left = left + 'px';
      el.style.width = (right - left) + 'px';
    });
  }

  function updateSelectedTimeInputsInPlace() {
    const field = document.querySelector('#selTimeField span');
    if (field) field.textContent = formatEventSpan(eventModalState.selStart, eventModalState.selEnd);
  }

  function attachSelectionDrag() {
    document.querySelectorAll('.sel-overlay').forEach((el) => {
      el.addEventListener('click', (e) => e.stopPropagation());

      el.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        const rect = el.getBoundingClientRect();
        const leftEdge = e.clientX - rect.left < 10;
        const rightEdge = rect.right - e.clientX < 10;
        e.preventDefault();

        const startX = e.clientX;
        const originalStart = eventModalState.selStart;
        const originalEnd = eventModalState.selEnd;
        const duration = originalEnd - originalStart;

        function snap(ms) {
          return Math.round(ms / (15 * 60000)) * (15 * 60000);
        }

        function onMove(ev) {
          const deltaMs = ((ev.clientX - startX) / PX_PER_MIN) * 60000;

          if (rightEdge) {
            let newEnd = snap(originalEnd + deltaMs);
            if (newEnd <= eventModalState.selStart + 15 * 60000) newEnd = eventModalState.selStart + 15 * 60000;
            eventModalState.selEnd = newEnd;
          } else if (leftEdge) {
            let newStart = snap(originalStart + deltaMs);
            if (newStart >= eventModalState.selEnd - 15 * 60000) newStart = eventModalState.selEnd - 15 * 60000;
            eventModalState.selStart = newStart;
          } else {
            const newStart = snap(originalStart + deltaMs);
            eventModalState.selStart = newStart;
            eventModalState.selEnd = newStart + duration;
          }

          updateSelectionOverlaysInPlace();
          updateSelectedTimeInputsInPlace();
        }

        function onUp() {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          renderEventResultsStep({ scroll: 'keep' });
        }

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });

      el.addEventListener('mousemove', (e) => {
        const rect = el.getBoundingClientRect();
        if (rect.right - e.clientX < 10 || e.clientX - rect.left < 10) {
          el.style.cursor = 'ew-resize';
        } else {
          el.style.cursor = 'grab';
        }
      });
    });
  }

  // ---------------------------------------------------------------
  // Ajanvalitsin: päivämäärä ja kellonaika samassa näkymässä.
  //   'rangeFrom' / 'rangeTo' (valintavaihe): yksi aika, lista 30 min välein, valinnainen
  //   'sel' (ehdotusvaihe): alku ja loppu, lista 15 min välein + vapaa kirjoitus;
  //   alun muutos siirtää loppua samalla kestolla, lopun muutos muuttaa kestoa.
  // ---------------------------------------------------------------

  const CAL_ICON_HTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5.5 1.8v2.4M10.5 1.8v2.4"/></svg>';
  let dtp = null;

  function formatDtValue(ms) {
    return `${formatDayHeading(ms)} ${formatClock(ms)}`;
  }

  function dtFieldInner(value) {
    const label = value ? formatDtValue(new Date(value).getTime()) : t('dtp_optional_placeholder');
    return `${CAL_ICON_HTML}<span style="flex:1;">${label}</span>`;
  }

  function dtpTriggerId(kind) {
    return kind === 'rangeFrom' ? 'rangeFromField' : kind === 'rangeTo' ? 'rangeToField' : 'selTimeField';
  }

  // Valitsimen nykyinen aika (ms) kohteelle: alku/loppu tai aikavälin kenttä.
  function dtpValue(which) {
    const s = eventModalState;
    if (dtp.kind === 'sel') return which === 'end' ? s.selEnd : s.selStart;
    return s[dtp.kind] ? new Date(s[dtp.kind]).getTime() : null;
  }

  function openDtp(kind) {
    const s = eventModalState;
    const base = kind === 'sel' ? s.selStart : (s[kind] ? new Date(s[kind]).getTime() : Date.now());
    const d = new Date(base);
    dtp = { kind, active: 'start', view: new Date(d.getFullYear(), d.getMonth(), 1), error: '' };
    renderDtp(true);
  }

  function closeDtp() {
    dtp = null;
    const el = document.getElementById('dtpPopover');
    if (el) el.remove();
  }

  function renderDtpIfOpen() {
    if (dtp && dtp.kind === 'sel') renderDtp(false);
  }

  function dtpSetActive(which) {
    dtp.active = which;
    const d = new Date(dtpValue(which));
    dtp.view = new Date(d.getFullYear(), d.getMonth(), 1);
    dtp.error = '';
    renderDtp(true);
  }

  function dtpShiftMonth(delta) {
    dtp.view = new Date(dtp.view.getFullYear(), dtp.view.getMonth() + delta, 1);
    renderDtp(false);
  }

  function minutesOfDay(ms) {
    const d = new Date(ms);
    return d.getHours() * 60 + d.getMinutes();
  }

  function atDateAndMinutes(dateStr, minutes) {
    const d = new Date(dateStr + 'T00:00:00');
    d.setMinutes(minutes);
    return d.getTime();
  }

  // Yhteinen asetus päivän tai kellonajan valinnalle.
  function dtpApply(dateStr, minutes) {
    const s = eventModalState;
    dtp.error = '';
    if (dtp.kind !== 'sel') {
      const cur = dtpValue('start');
      const defaultMinutes = dtp.kind === 'rangeFrom' ? 8 * 60 : 18 * 60;
      const date = dateStr || toDateStr(new Date(cur || Date.now()));
      const mins = minutes !== null ? minutes : (cur !== null ? minutesOfDay(cur) : defaultMinutes);
      s[dtp.kind] = formatDatetimeLocal(atDateAndMinutes(date, mins));
      const field = document.getElementById(dtpTriggerId(dtp.kind));
      if (field) { field.innerHTML = dtFieldInner(s[dtp.kind]); field.classList.remove('empty'); }
      renderDtp(false);
      return;
    }
    if (dtp.active === 'start') {
      const date = dateStr || toDateStr(new Date(s.selStart));
      const newStart = atDateAndMinutes(date, minutes !== null ? minutes : minutesOfDay(s.selStart));
      applySelection(newStart, newStart + (s.selEnd - s.selStart));
    } else {
      const date = dateStr || toDateStr(new Date(s.selEnd));
      const newEnd = atDateAndMinutes(date, minutes !== null ? minutes : minutesOfDay(s.selEnd));
      if (newEnd <= s.selStart) {
        dtp.error = t('dtp_end_before_start');
        renderDtp(false);
        return;
      }
      applySelection(s.selStart, newEnd);
    }
  }

  // Kirjoitettu aika: "13", "13.10", "13:10" tai "1310".
  function dtpTypedTime(value) {
    const m = String(value).trim().match(/^(\d{1,2})(?:[.:]?(\d{2}))?$/);
    if (!m) { dtp.error = t('dtp_invalid_time'); renderDtp(false); return; }
    const h = Number(m[1]), min = Number(m[2] || 0);
    if (h > 23 || min > 59) { dtp.error = t('dtp_invalid_time'); renderDtp(false); return; }
    dtpApply(null, h * 60 + min);
  }

  function dtpClear() {
    eventModalState[dtp.kind] = '';
    const field = document.getElementById(dtpTriggerId(dtp.kind));
    if (field) { field.innerHTML = dtFieldInner(''); field.classList.add('empty'); }
    closeDtp();
  }

  function renderDtp(scrollTimes) {
    if (!dtp) return;
    const trigger = document.getElementById(dtpTriggerId(dtp.kind));
    if (!trigger) { closeDtp(); return; }
    const isSel = dtp.kind === 'sel';
    const activeMs = dtpValue(dtp.active);
    const startMs = dtpValue('start');
    const endMs = isSel ? dtpValue('end') : null;
    const startDay = startMs !== null ? toDateStr(new Date(startMs)) : null;
    const endDay = endMs !== null ? toDateStr(new Date(endMs)) : null;

    // Kuukausikalenteri, viikko alkaa maanantaista.
    const first = dtp.view;
    const offset = (first.getDay() + 6) % 7;
    const gridStart = new Date(first.getFullYear(), first.getMonth(), 1 - offset);
    let days = '';
    for (let i = 0; i < 42; i++) {
      const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
      const ds = toDateStr(d);
      const cls = ['dtp-day'];
      if (d.getMonth() !== first.getMonth()) cls.push('other');
      if (ds === todayDateStr()) cls.push('today');
      if (ds === startDay || ds === endDay) cls.push('sel');
      else if (isSel && startDay && endDay && ds > startDay && ds < endDay) cls.push('in-range');
      days += `<button type="button" class="${cls.join(' ')}" onclick="dtpApply('${ds}', null)">${d.getDate()}</button>`;
    }
    const wd = weekdayShortArr().map((w) => `<span class="dtp-wd">${w}</span>`).join('');
    const monthName = t('rec_month_nom_' + (first.getMonth() + 1));

    const step = isSel ? 15 : 30;
    const activeMinutes = activeMs !== null ? minutesOfDay(activeMs) : null;
    let times = '';
    for (let m = 0; m < 24 * 60; m += step) {
      const label = String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
      times += `<button type="button" class="dtp-time ${m === activeMinutes ? 'sel' : ''}" data-min="${m}" onclick="dtpApply(null, ${m})">${label}</button>`;
    }

    const ends = isSel ? `
      <div class="dtp-ends">
        <button type="button" class="dtp-end-btn ${dtp.active === 'start' ? 'active' : ''}" onclick="dtpSetActive('start')"><b>${t('dtp_start')}</b>${formatDtValue(startMs)}</button>
        <button type="button" class="dtp-end-btn ${dtp.active === 'end' ? 'active' : ''}" onclick="dtpSetActive('end')"><b>${t('dtp_end')}</b>${formatDtValue(endMs)}</button>

    const left = pxForTimestamp(s.selStart, s.calAnchor);
    const right = pxForTimestamp(s.selEnd, s.calAnchor);
    if (left === null) { scrollEventCalToSelected(); return; }
    const r = right === null ? left + 40 : right;
    if (left < el.scrollLeft || r > el.scrollLeft + el.clientWidth) {
      el.scrollLeft = Math.max(0, (left + r) / 2 - el.clientWidth / 2);

      renderEventResultsStep({ scroll: 'keep' });

      renderEventResultsStep({ scroll: 'selection' });

  function attachEventCalPaging() {
    const el = document.getElementById('eventTimelineCol');
    if (!el) return;
    el.addEventListener('scrollend', () => {

      if (el.scrollLeft >= max - 4) {
        eventModalState.calAnchor = stepDayBy(eventModalState.calAnchor, 4);
        renderEventResultsStep({ shiftDays: 4 });
      } else if (el.scrollLeft <= 0) {
        eventModalState.calAnchor = stepDayBy(eventModalState.calAnchor, -4);
        renderEventResultsStep({ shiftDays: -4 });
      }
    });
  }

  function scrollEventCalToSelected() {
    const el = document.getElementById('eventTimelineCol');
    if (!el) return;
    const start = new Date(eventModalState.selStart);
    const minutesFromWindowStart = (start.getHours() * 60 + start.getMinutes()) - HOURS_START * 60;
    el.scrollLeft = DAY_VISIBLE_PX + Math.max(0, minutesFromWindowStart) * PX_PER_MIN;

  // Purkaa ryhmät jäseniksi, poistaa duplikaatit (pakollinen voittaa),
  // jättää järjestäjän itsensä pois ja merkitsee konfliktit.
  function buildInviteAttendees() {
    const s = eventModalState;
    const roleById = {};

    function assign(id, role) {
      if (roleById[id] === 'required') return;
      if (role === 'required' || !roleById[id]) roleById[id] = role;
    }

    Object.entries(s.peopleRoles).forEach(([id, role]) => assign(id, role));
    Object.entries(s.groupRoles).forEach(([gid, role]) => {
      const g = (latestStatus.groups || []).find((x) => x.id === gid);
      if (!g) return;
      (g.members || []).forEach((m) => assign(m.participantId, role));
    });

    // Toistuvassa tapahtumassa konflikti = päällekkäisyys millä tahansa kerralla.
    const slots = isRecurringSeries() ? s.occurrences : [selectedSlot()];

    const list = Object.entries(roleById).map(([id, role]) => {
      const p = latestStatus.participants.find((x) => x.id === id);
      if (!p) return null;
      if (p.email.toLowerCase() === currentUserEmail) return null;

      const hasCalendar = p.status === 'authorized' && !!p.scheduleItems;
      const busy = hasCalendar ? resolvePersonBusy(id) : [];
      const conflict = hasCalendar &&
        slots.some((slot) => busy.some((b) => overlapsMs(slot.startMs, slot.endMs, b.startMs, b.endMs)));

            return {
        id,
        role,
        email: p.email,
        name: nameLabelFor(p),
        hasName: !!(p.firstName || p.lastName),
        noCalendar: !hasCalendar,
        conflict,
      };
    }).filter(Boolean);

    list.sort((a, b) => a.name.localeCompare(b.name, 'fi'));

    return {
      required: list.filter((x) => x.role === 'required'),
      optional: list.filter((x) => x.role === 'optional'),
    };
  }

  // "Antti Heinonen <antti@firma.fi>; Heikki Jou <heikki@jou.fi>"

      .join('; ');
  }

  }
