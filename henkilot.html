<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meetsko — Kaikki henkilöt</title>
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='36' height='36' rx='8' fill='%231B3A6B'/%3E%3Crect x='24' y='24' width='36' height='36' rx='8' fill='%238FB3E8'/%3E%3Cpath d='M24 32A8 8 0 0 1 32 24H40V32A8 8 0 0 1 32 40H24Z' fill='%232BB39A'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/app.css" />
<style>
  .search-bar { position: relative; max-width: 420px; margin-bottom: 20px; }
  .search-bar svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-faint); }
  .form-scope .search-bar input { width: 100%; padding-left: 36px; }

  .list-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .person-row { display: grid; grid-template-columns: minmax(220px, 1.1fr) minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 20px; align-items: start; padding: 18px 20px; border-top: 1px solid var(--line-soft); }
  .person-row:first-child { border-top: none; }
  .person-id { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .person-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600; flex: 0 0 36px; }
  .person-id .p-name { font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .person-id .p-email { font-size: 13px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; }

  .tag-label { font-size: 11px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { background: #EEF1F4; border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--primary); }
  .tag.status-authorized { background: var(--ok-soft); color: var(--ok); }
  .tag.status-expired { background: var(--danger-soft); color: #9C2C22; }
  .tag.status-pending { background: #FBF0D9; color: #91600C; }
  .muted { color: var(--text-faint); font-size: 12.5px; }
  .empty-state { padding: 22px 24px; border: 1px dashed #CDD3DB; border-radius: 12px; background: var(--surface); color: var(--text-muted); font-size: 14px; }

  @media (max-width: 1000px) {
    .person-row { grid-template-columns: 1fr auto; }
    .person-row .tags-org, .person-row .tags-proj { grid-column: 1 / -1; }
    .person-row .delete-cell { grid-row: 1; grid-column: 2; }
  }
</style>
</head>
<body>

<div id="appNav"></div>

<main class="page form-scope">
  <a class="back" href="/projektit.html">&larr; <span data-i18n="back_all_projects"></span></a>
  <div class="page-head">
    <div>
      <h1 data-i18n="heading_people"></h1>
      <p class="page-sub" data-i18n="sub_people"></p>
    </div>
  </div>

  <div class="search-bar">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>
    <input type="text" id="searchInput" data-i18n-placeholder="search_placeholder" oninput="renderList()" />
  </div>

  <div id="list"><p class="note" data-i18n="loading"></p></div>
</main>

<script src="/translations.js"></script>
<script src="/dialogs.js"></script>
<script src="/nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://nrrhvbxvkizvkcwwglck.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ycmh2Ynh2a2l6dmtjd3dnbGNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU3NDAsImV4cCI6MjEwMzA0MTc0MH0.S_M4KyTt4E_UG0ue-T-h89L17yxJKkmb36ZzNRdQnLI";
  const client = supabase.createClient(SUPABASE_URL, ANON_KEY);

  let allPeople = [];
  let myProfileData = null;

  // Istunto: tuore token ennen jokaista kutsua, vanhentuneesta istunnosta oma ikkuna (nav.js, bugi 3).
  AppNav.initSession({ client, url: SUPABASE_URL, anonKey: ANON_KEY });
  AppNav.mount('people');

  function escapeHtml(str) {
    return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  async function logout() {
    await client.auth.signOut();
    window.location.href = '/login.html';
  }

  async function setLanguagePref(lang) {
    setCurrentLanguage(lang);
    if (myProfileData) {
      await AppNav.fetch(`${SUPABASE_URL}/functions/v1/update-my-profile`, {
        method: 'POST',
        body: JSON.stringify({
          firstName: myProfileData.firstName,
          lastName: myProfileData.lastName,
          title: myProfileData.title,
          organization: myProfileData.organization,
          team: myProfileData.team,
          language: lang,
        }),
      });
    }
    window.location.reload();
  }

  async function loadMyProfileAndTranslations() {
    const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/get-my-profile`, {
      method: 'POST',
    });
    const data = await res.json();
    if (!data.error) {
      myProfileData = data;
      setCurrentLanguage(data.language || 'fi');
    }
    applyStaticTranslations();
    if (!data.error) AppNav.setProfile(data);
  }

  async function ensureLoggedIn() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
      window.location.href = '/login.html?next=' + encodeURIComponent(window.location.pathname + window.location.search);
      return false;
    }
    return true;
  }

  async function loadPeople() {
    const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/list-all-people`, {
      method: 'POST',
    });
    const data = await res.json();

    if (data.error) {
      document.getElementById('list').innerHTML = `<div class="empty-state">${t('error_prefix')}: ${escapeHtml(data.error)}</div>`;
      return;
    }

    allPeople = data.people;
    renderList();
  }

  // Projektiton profiili poistuu 12 kk merkinnästä (calendar-sync, job "retention").
  function retentionDate(inactiveSince) {
    const d = new Date(inactiveSince);
    d.setFullYear(d.getFullYear() + 1);
    return d.toLocaleDateString(getCurrentLanguage() === 'en' ? 'en-GB' : 'fi-FI');
  }

  function statusLabel(status) {
    if (status === 'authorized') return t('cal_status_authorized');
    if (status === 'expired') return t('cal_status_expired');
    return t('cal_status_pending');
  }

  function renderList() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const filtered = allPeople.filter((p) => {
      const name = ((p.firstName || '') + ' ' + (p.lastName || '')).toLowerCase();
      return p.email.toLowerCase().includes(query) || name.includes(query);
    });

    const list = document.getElementById('list');

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state">${t('empty_no_results')}</div>`;
      return;
    }

    list.innerHTML = `<div class="list-panel">${filtered.map((p) => {
      const name = (p.firstName || p.lastName) ? `${p.firstName || ''} ${p.lastName || ''}`.trim() : '';

      const orgTags = p.organizations.map((o) =>
        `<span class="tag">${escapeHtml(o.organizationName)} — ${o.role === 'superuser' ? t('role_suffix_superuser') : t('role_suffix_member')}</span>`
      ).join('') || `<span class="muted">${t('empty_no_org_memberships')}</span>`;

      const projectTags = p.projects.map((pr) => {
        const orgPart = pr.organizationName ? `${escapeHtml(pr.organizationName)} / ` : '';
        return `<span class="tag status-${pr.status}">${orgPart}${escapeHtml(pr.projectName)} — ${statusLabel(pr.status)}</span>`;
      }).join('') || (p.inactiveSince
        ? `<span class="tag status-expired">${t('people_removal_pending', { date: retentionDate(p.inactiveSince) })}</span>`
        : `<span class="muted">${t('empty_no_project_memberships')}</span>`);

      return `
        <div class="person-row">
          <div class="person-id">
            <span class="person-avatar">${escapeHtml(AppNav.initials(name || p.email))}</span>
            <div style="min-width:0;">
              <div class="p-name">${escapeHtml(name || p.email)}</div>
              ${name ? `<div class="p-email">${escapeHtml(p.email)}</div>` : ''}
            </div>
          </div>
          <div class="tags-org">
            <div class="tag-label">${t('tag_organizations')}</div>
            <div class="tag-row">${orgTags}</div>
          </div>
          <div class="tags-proj">
            <div class="tag-label">${t('tag_projects')}</div>
            <div class="tag-row">${projectTags}</div>
          </div>
          <div class="delete-cell">
            ${p.isSuperadmin
              ? `<span class="tag">${t('role_app_admin')}</span>`
              : `<button class="danger small" onclick="deletePerson('${p.email.replace(/'/g, "\\'")}')">${t('delete_user_btn')}</button>`}
          </div>
        </div>
      `;
    }).join('')}</div>`;
  }

  async function deletePerson(email) {
    const firstConfirm = (await AppDialog.confirm(t('confirm_delete_user_1', { email }), { danger: true }));
    if (!firstConfirm) return;

    const secondConfirm = (await AppDialog.confirm(t('confirm_delete_user_2', { email }), { danger: true }));
    if (!secondConfirm) return;

    const res = await AppNav.fetch(`${SUPABASE_URL}/functions/v1/delete-person-everywhere`, {
      method: 'POST',
      body: JSON.stringify({ email }),
    });
    const data = await res.json();

    if (data.error) {
      AppDialog.alert(t('error_prefix') + ': ' + data.error);
      return;
    }

    loadPeople();
  }

  (async () => {
    const ok = await ensureLoggedIn();
    if (ok) {
      await loadMyProfileAndTranslations();
      loadPeople();
    }
  })();
</script>

</body>
</html>
